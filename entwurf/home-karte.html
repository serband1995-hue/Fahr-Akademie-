<meta charset="utf-8">
<title>Fahr-Akademie Home und Karte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* Drei klickbare Prototypen: Apple-TV-Bühne plus „Dein Weg“. Hell, flache Illustration, schwebende Kacheln (ruhig).
   Layout: Pager oben, darunter ein Handy-Rahmen, der jeweils einen Prototyp zeigt. */
:root{ --bg:#EEF0EC; --ink:#1E241F; --muted:#6B7269; --g:#2E7D5B; --gl:#E3F2EA; --gold:#E8A33D; --ff:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:light; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kopf{padding:16px 18px 0;max-width:520px;margin:0 auto}
.kopf h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kopf p{margin:4px 0 0;color:var(--muted);font-size:14.5px;line-height:1.35}
.pager{display:flex;gap:8px;padding:12px 18px 6px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.pager::-webkit-scrollbar{display:none}
.pager button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.08);font-weight:700;font-size:14.5px}
.pager button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.beschr{max-width:420px;margin:2px auto 12px;padding:0 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.35;min-height:38px}
.tel{position:relative;width:min(94vw,392px);height:min(800px,calc(100dvh - 170px));min-height:640px;margin:0 auto 30px;border-radius:40px;overflow:hidden;background:#F5F6F3;border:1px solid rgba(0,0,0,.08);box-shadow:0 24px 60px rgba(30,36,31,.18)}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:116px;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:14px;font-weight:700;position:relative;z-index:3}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;border-radius:28px;padding:6px;z-index:8;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(30,36,31,.16);border:1px solid rgba(0,0,0,.05)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:22px;font-size:11px;font-weight:600;color:#80877E}
.tabbar button[aria-current="page"]{color:var(--g);background:var(--gl)}
.tabbar svg{width:23px;height:23px}
.klasse{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:none;border:1px solid rgba(0,0,0,.05)}
.klasse button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;min-height:32px;color:#6B7269}
.klasse button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:800;font-size:16px}
.pill svg{width:18px;height:18px;fill:currentColor}
.titel{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.abschn{display:flex;justify-content:space-between;align-items:baseline;padding:26px 22px 10px}
.abschn h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.abschn button{color:var(--g);font-weight:700;font-size:15px;min-height:32px}
/* schwebende Kacheln */
.kachel{position:relative;display:block;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 2px 4px rgba(30,36,31,.06),0 14px 30px rgba(30,36,31,.12);animation:schweb 7s ease-in-out infinite;transition:transform .2s ease,box-shadow .2s ease}
.kachel:active{transform:scale(.97);animation-play-state:paused}
@keyframes schweb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.kachel .art{height:110px;position:relative;overflow:hidden}
.kachel .art svg{position:absolute;inset:0;width:100%;height:100%}
.kachel .tx{padding:11px 14px 14px}
.kachel .tx small{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.kachel .tx b{display:block;font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:6px 18px 8px}
.reihe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 22px;scrollbar-width:none;scroll-padding-inline:20px}
.reihe::-webkit-scrollbar{display:none}
.reihe .kachel{flex:0 0 66%;scroll-snap-align:start}
.reihe .kachel.q{flex:0 0 118px}
/* Weg */
.weg{position:relative}
.weg .knoten{position:absolute;display:grid;place-items:center;border-radius:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid #D8DED7;color:#9AA39A;z-index:2;transition:background .4s,border-color .4s,color .4s}
.weg .knoten svg{width:55%;height:55%}
.weg .knoten.ok{background:var(--g);border-color:var(--g);color:#fff}
.weg .knoten.naechst{background:#fff;border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 8px rgba(232,163,61,.18)}
.weg .knoten.ziel{border-radius:16px}
.weg .marker{pointer-events:none;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:4;box-shadow:0 8px 18px rgba(30,36,31,.3),0 0 0 4px #fff}
.weg .marker svg{width:24px;height:24px}
.weg .lbl{position:absolute;z-index:1;font-size:13.5px;line-height:1.2;overflow-wrap:anywhere}
.weg .lbl b{display:block;font-size:15.5px;font-weight:800}
.weg .lbl span{color:var(--muted)}
.karte{background:#fff;border-radius:28px;box-shadow:0 2px 4px rgba(30,36,31,.05),0 12px 30px rgba(30,36,31,.09)}
.liste{margin:0 18px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 4px rgba(30,36,31,.05),0 10px 26px rgba(30,36,31,.08)}
.zeile{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border-top:1px solid #EEF0EC}
.zeile:first-child{border-top:0}
.zeile .sym{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--gl);color:var(--g);flex:none}
.zeile .sym svg{width:22px;height:22px}
.zeile .t{flex:1;min-width:0}
.zeile .t b{display:block;font-size:16.5px;line-height:1.2}
.zeile .t span{font-size:13.5px;color:var(--muted)}
.zeile .p{color:#B5BBB3;font-size:22px}
.zurueck{display:inline-flex;align-items:center;margin:10px 0 0 10px;padding:0 14px 0 4px;min-height:44px;color:var(--g);font-weight:700}
.zurueck svg{width:22px;height:22px}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;z-index:30;max-width:calc(100% - 40px);padding:12px 18px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;transition:all .25s;pointer-events:none;text-align:center}
.toast.an{opacity:1;transform:translate(-50%,0)}
.video{position:absolute;inset:0;z-index:25;background:rgba(245,246,243,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.video.an{display:flex}
.video .bar{width:70%;height:8px;border-radius:9px;background:#DDE3DC;overflow:hidden}
.video .bar i{display:block;height:100%;width:0;background:var(--g);transition:width 2s linear}
@media (prefers-reduced-motion:reduce){ .kachel{animation:none} .scroll{scroll-behavior:auto} }
</style>

      window.__von=null; if(Math.abs(vz-tpos())>0.001) setTimeout(function(){ if(cur) wegAnim(cur,tpos(),function(){ if(cur) cur.stationen(); }); },350); }
  }
}
