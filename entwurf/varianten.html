<meta charset="utf-8">
<title>Fahr-Akademie Startseiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Fünf helle Startseiten für die Fahr-Akademie. Gemeinsam: viel Weiß, große Typo, flache Illustration statt Fotos.
   Seite: waagerechte Wischreihe, jede Variante ein Handy-Rahmen mit eigenem Scroll. */
:root{ --bg:#EEF0EC; --ink:#1E241F; --muted:#6B7269; --ff:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:light; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start;-webkit-tap-highlight-color:transparent}
.kopf{padding:20px 20px 6px;max-width:900px;margin:0 auto}
.kopf h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.kopf p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:46ch}
.pager{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pager button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.08);font-weight:700;font-size:14.5px}
.pager button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.reihe5{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 16px 40px;scrollbar-width:none;scroll-padding-inline:16px}
.reihe5::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(92vw,390px);scroll-snap-align:center}
.slide>h2{margin:0 4px 2px;font-size:19px;font-weight:800}
.slide>p{margin:0 4px 12px;color:var(--muted);font-size:14px;line-height:1.35;min-height:38px}
.tel{position:relative;height:790px;border-radius:40px;overflow:hidden;background:var(--b,#fff);border:1px solid rgba(0,0,0,.08);box-shadow:0 24px 60px rgba(30,36,31,.16)}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:120px}
.scroll::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;border-radius:28px;padding:6px;z-index:5}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:22px;font-size:11px;font-weight:600}
.tabbar svg{width:23px;height:23px}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:14px;font-weight:700}
.klasse{display:inline-flex;padding:3px;border-radius:999px;flex:none}
.klasse span{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;min-height:32px;display:inline-flex;align-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:800;font-size:16px}
.pill svg{width:18px;height:18px;fill:currentColor}
.sk{display:flex;justify-content:space-between;align-items:baseline}
svg{display:block}
@media (min-width:1000px){ .reihe5{justify-content:flex-start} }
</style>

<div class="kopf"><h1>Fünf Startseiten</h1><p>Alle hell, ohne Fotos. Wisch nach links für die nächste Variante. In jedem Rahmen kannst du nach unten scrollen.</p></div>
<div class="pager" id="pager"></div>
<div class="reihe5" id="reihe"></div>
