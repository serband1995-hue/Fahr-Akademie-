async function createSchueler(){
  const name = document.getElementById("ns-name").value.trim();
  const tel = document.getElementById("ns-tel").value.trim().replace(/\s+/g, "");
  const email = document.getElementById("ns-email").value.trim();
  const klasse = document.getElementById("ns-klasse").value;
  const dauerMonate = parseInt(document.getElementById("ns-dauer").value, 10) || 6;
  const flId = document.getElementById("ns-fl").value;
  if(!name || !tel){ showToast("Name und Telefonnummer sind Pflicht"); return; }

  const pin = genPin();
  const jetzt = new Date();
  const neu = {
    id: "s" + Date.now(),
    name: name, telefon: tel, email: email || null, pin: pin, klasse: klasse,
    fahrlehrer_id: flId,
    vergeben_von: flId,
    empfohlen_von: flId === "serband" ? null : flId,
    erstellt_am: jetzt.toISOString(),
    ablauf_am: addMonthsISO(jetzt, dauerMonate),
    aktiv: true
  };

  if(DEMO_MODE){
    DEMO_SCHUELER.unshift(neu);
    allSchueler = DEMO_SCHUELER;
    await sendPinMail(neu);
    renderAdminSchueler();
    showToast("Schüler angelegt — PIN " + (email ? "per Mail verschickt" : "wurde NICHT verschickt (keine E-Mail hinterlegt)"));
    return;
  }

  const { error } = await supa.from("academy_schueler").insert(neu);
  if(error){ showToast("Fehler: " + error.message); return; }
  await sendPinMail(neu);
  await loadAdminData();
  renderAdminSchueler();
  showToast("Schüler angelegt — PIN per Mail verschickt");
}

async function sendPinMail(schueler){
  if(!schueler.email) return;
  if(DEMO_MODE){
    console.log("[DEMO] PIN-Mail an " + schueler.email + ": PIN " + schueler.pin);
    return;
  }
  try{
    // Seit Schritt 3 (18.07.2026): die Function schlägt E-Mail/PIN selbst in der DB
    // nach und prüft, dass der Aufrufer ein eingeloggter Admin ist — daher hier der
    // echte Admin-Access-Token statt des anon-Keys, und nur noch die schueler_id.
    const { data: sessionData } = await supa.auth.getSession();
    const token = sessionData && sessionData.session ? sessionData.session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-send-pin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ schueler_id: schueler.id })
    });
    const data = await res.json();
    if(!res.ok){
      showToast("Mail-Versand fehlgeschlagen: " + (data.error || "unbekannter Fehler"));
    }
  } catch(e){
    showToast("Schüler gespeichert, aber Mail-Versand fehlgeschlagen");
  }
}

async function resendPin(id){
  const s = allSchueler.find(function(x){ return x.id === id; });
  if(!s){ return; }
  if(!s.email){ showToast("Keine E-Mail hinterlegt"); return; }
  await sendPinMail(s);
  showToast("PIN erneut an " + s.email + " gesendet");
}

async function toggleSchueler(id){
  const s = allSchueler.find(function(x){ return x.id === id; });
  if(!s) return;

  // Nur beim SPERREN nach einem Grund fragen (beim Entsperren nicht nötig) --
  // dient dir als Nachweis, falls es wegen Weitergabe/Missbrauch zum Streit kommt.
  let grund = s.sperrgrund || null;
  if(s.aktiv){
    grund = prompt("Grund für die Sperrung (optional, z. B. \"Zugangsdaten weitergegeben\"):", "");
    if(grund === null) return; // Abgebrochen -> nichts ändern
  }
  s.aktiv = !s.aktiv;
  s.sperrgrund = s.aktiv ? null : (grund || "Kein Grund angegeben");

  if(DEMO_MODE){
    renderAdminSchueler();
    return;
  }
  const { error } = await supa.from("academy_schueler").update({ aktiv: s.aktiv, sperrgrund: s.sperrgrund }).eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  protokolliere(s.aktiv ? "schueler_entsperrt" : "schueler_gesperrt", "schueler", id, s.name, s.aktiv ? null : s.sperrgrund);
  renderAdminSchueler();
}

async function deleteSchueler(id){
  if(!confirm("Diesen Schüler wirklich löschen?")) return;
  // Namen VOR dem Löschen sichern -- danach ist er nicht mehr abrufbar
  const weg = allSchueler.find(function(x){ return x.id === id; });
  const wegName = weg ? weg.name : "(unbekannt)";

  if(DEMO_MODE){
    DEMO_SCHUELER = DEMO_SCHUELER.filter(function(x){ return x.id !== id; });
    allSchueler = DEMO_SCHUELER;
    renderAdminSchueler();
    return;
  }
  const { error } = await supa.from("academy_schueler").delete().eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  await protokolliere("schueler_geloescht", "schueler", id, wegName, "Zugang vollständig entfernt (DSGVO Art. 17)");
  await loadAdminData();
  renderAdminSchueler();
}

/* ---------- VIDEOS-TAB ---------- */
function renderAdminVideos(){
  // --- Bereich 8.3 (27.08.2026): nach Stufe filtern statt durch alles zu scrollen ---
  // Ein Video kann über mehrere Tags zu mehreren Stufen gehören, daher "irgendein
  // Tag passt" statt einer festen Zuordnung.
  const stufenVonVideo = function(v){
    return videoTags.filter(function(vt){ return vt.video_id === v.id; })
      .map(function(vt){ const t = allTags.find(function(x){ return x.id === vt.tag_id; }); return t ? t.stufe : null; })
      .filter(Boolean);
  };
  const gefilterteVideos = videoFilterStufe
    ? allVideos.filter(function(v){
        if(videoFilterStufe === "__ohne_bunny__") return !v.bunny_video_id;
        return stufenVonVideo(v).indexOf(videoFilterStufe) !== -1;
      })
    : allVideos;

  const rows = gefilterteVideos.map(function(v){
    const tagsForVideo = videoTags.filter(function(vt){ return vt.video_id === v.id; })
      .map(function(vt){ const t = allTags.find(function(x){ return x.id === vt.tag_id; }); return t ? t.label : null; })
      .filter(Boolean).join(", ");
    const prueferForVideo = videoPruefer.filter(function(vp){ return vp.video_id === v.id; })
      .map(function(vp){ return allPruefer.find(function(p){ return p.id === vp.pruefer_id; }); })
      .filter(Boolean);
    const verknuepft = !!v.bunny_video_id;

    const prueferChips = prueferForVideo.map(function(p){
      return '<span class="admin-badge badge-gesperrt" style="margin-right:4px;">' + esc(p.name) +
        ' <span data-rmpr="' + esc(v.id) + '|' + esc(p.id) + '" style="cursor:pointer;font-weight:900;">×</span></span>';
    }).join("");

    const restlichePruefer = allPruefer.filter(function(p){
      return !prueferForVideo.some(function(pf){ return pf.id === p.id; });
    });
    const addPrueferSelect = restlichePruefer.length
      ? '<select data-addpr-select="' + esc(v.id) + '" style="margin-top:6px;width:auto;display:inline-block;padding:6px 10px;font-size:12.5px;">' +
          restlichePruefer.map(function(p){ return '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>"; }).join("") +
        "</select> " +
        '<button data-addpr-btn="' + esc(v.id) + '" class="icon-btn" style="font-size:12px;">+ Prüfer</button>'
      : "";

    return '<div class="admin-card glass">' +
      '<div class="admin-row">' +
        '<div>' +
          '<div class="admin-name">' + esc(v.titel) + "</div>" +
          (v.beschreibung ? '<div class="admin-sub">' + esc(v.beschreibung) + "</div>" : "") +
          (tagsForVideo ? '<div class="admin-sub">Tags: ' + esc(tagsForVideo) + "</div>" : "") +
          '<div class="admin-badge ' + (verknuepft ? "badge-aktiv" : "badge-abgelaufen") + '" style="margin-top:6px;display:inline-block;">' +
            (verknuepft ? "🎬 Mit Bunny verknüpft" : "⚠️ Kein Video verknüpft") +
          "</div>" +
          '<div class="admin-sub" style="margin-top:8px;">Prüfer: ' + (prueferChips || "keiner") + "</div>" +
          '<div style="margin-top:4px;">' + addPrueferSelect + "</div>" +
        "</div>" +
        '<div style="text-align:right;">' +
          '<button class="icon-btn" data-editv="' + esc(v.id) + '" title="Bunny-Video-ID eintragen/ändern">' + icon("stift") + '</button>' +
          '<button class="icon-btn" data-notifyv="' + esc(v.id) + '" title="Push-Benachrichtigung an alle aktiven Schüler senden">' + icon("glocke") + '</button>' +
          '<button class="icon-btn danger" data-delv="' + esc(v.id) + '" title="Löschen">' + icon("papierkorb") + '</button>' +
        "</div>" +
      "</div>" +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Videos angelegt.</div>';

  // Themen als flache, durchsuchbare Liste (statt gruppierter Checkbox-Wand):
  // Bereich steht rechts als kleiner Hinweis, gesucht wird über Thema UND Bereich.
  const themenZeilen = allTags.slice()
    .sort(function(a,b){ return (a.reihenfolge||0)-(b.reihenfolge||0); })
    .map(function(t){
      const such = ((t.label||"") + " " + (t.stufe||"")).toLowerCase();
      return '<label class="thema-zeile" data-such="' + esc(such) + '">' +
        '<input type="checkbox" value="' + esc(t.id) + '" class="nv-tag-cb" data-label="' + esc(t.label) + '">' +
        "<span>" + esc(t.label) + "</span>" +
        '<span class="thema-bereich">' + esc(t.stufe) + "</span>" +
      "</label>";
    }).join("");

  const prueferCheckboxes = allPruefer.map(function(p){
    return '<label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin-bottom:0;padding:6px;border-radius:8px;">' +
      '<input type="checkbox" value="' + esc(p.id) + '" class="nv-pruefer-cb" style="margin-top:2px;flex:none;width:18px;height:18px;">' +
      '<span style="flex:1;line-height:1.3;">' + esc(p.name) + '</span>' +

  }).join("");

  document.getElementById("admin-content").innerHTML =
    '<div class="admin-form glass">' +
      '<div class="admin-form-title" style="font-size:17px;">Neues Video anlegen</div>' +
      '<div class="admin-sub" style="margin-bottom:14px;">So kommt ein Video von deinem Handy zu den Schülern — 4 Schritte.</div>' +

      // Schritt 1
      '<div class="schritt-block">' +
        '<div class="schritt-kopf"><span class="schritt-nr">1</span><span class="schritt-titel">Video zu Bunny hochladen</span></div>' +
        '<div class="schritt-hilfe">Öffne <b>bunny.net</b> → links „Stream" → deine Library → Button <b>„Upload Video"</b>. ' +
        'Warte, bis der Balken bei 100 % ist. Tipp danach auf das Video — dort steht eine lange Zeichenfolge namens ' +
        '<b>„Video GUID"</b>. Die kopierst du und fügst sie unten in Schritt 3 ein.</div>' +
      "</div>" +

      // Schritt 2
      '<div class="schritt-block">' +
        '<div class="schritt-kopf"><span class="schritt-nr">2</span><span class="schritt-titel">Titel und Beschreibung</span></div>' +
        '<div class="schritt-hilfe">Kurz und klar, so wie es die Schüler in der Liste sehen sollen — z. B. „Kreisverkehr Bürgel".</div>' +
        '<label>Titel (Pflicht)</label><input id="nv-titel" placeholder="z. B. Kreisverkehr Bürgel">' +
        '<label>Beschreibung (optional)</label><input id="nv-desc" placeholder="Worum geht es in dem Video?">' +
      "</div>" +

      // Schritt 3
      '<div class="schritt-block">' +
        '<div class="schritt-kopf"><span class="schritt-nr">3</span><span class="schritt-titel">Video-ID einfügen</span></div>' +
        '<div class="schritt-hilfe">Die „Video GUID" aus Schritt 1 hier einfügen. Ohne sie ist das Video für Schüler ' +
        'nicht abspielbar — du kannst sie aber auch später über das Stift-Symbol nachtragen.</div>' +
        '<label>Bunny-Video-ID</label><input id="nv-bunny" placeholder="z. B. 3a1f9c2e-8b4d-...">' +
      "</div>" +

      // Schritt 4
      '<div class="schritt-block">' +
        '<div class="schritt-kopf"><span class="schritt-nr">4</span><span class="schritt-titel">Themen zuordnen</span></div>' +
        '<div class="schritt-hilfe">Wähle <b>alle</b> Situationen aus, die im Video vorkommen — nicht nur eine. ' +
        'Kommen im Video z. B. ein Zebrastreifen UND eine Engstelle vor, hak beide an. So finden die Schüler ' +
        'das Video später über jedes dieser Themen. Tipp: oben ins Suchfeld tippen, statt zu scrollen.</div>' +
        '<div class="themen-gewaehlt" id="nv-tag-chips"></div>' +
        '<input class="themen-suche" id="nv-tag-suche" placeholder="Thema suchen, z. B. Zebra">' +
        '<div class="themen-box" id="nv-tag-box">' + (themenZeilen || '<span class="admin-sub">Noch keine Themen angelegt</span>') + "</div>" +

        '<label style="margin-top:12px;">Ist das eine Originalprüfung?</label>' +
        '<select id="nv-pruefungsergebnis"><option value="">Nein, normales Lernvideo</option><option value="bestanden">Ja — bestanden</option><option value="nicht_bestanden">Ja — nicht bestanden</option></select>' +

        '<label style="margin-top:12px;">Prüfer (optional, Mehrfachauswahl)</label>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 10px;">' + (prueferCheckboxes || '<span class="admin-sub">Noch keine Prüfer angelegt</span>') + "</div>" +
      "</div>" +

      '<button class="btn-primary" id="nv-btn" style="margin-top:6px;">Video anlegen &amp; Schüler benachrichtigen</button>' +
      '<div class="admin-sub" style="margin-top:6px;">Nach dem Anlegen erscheint das Video sofort bei allen Schülern — und alle mit aktivierten Benachrichtigungen bekommen automatisch eine Push-Nachricht.</div>' +
    "</div>" +
    '<div class="admin-card glass" style="margin-bottom:10px;">' +
      '<label>Filtern</label>' +
      '<select id="vid-filter">' +
        '<option value="">Alle Stufen (' + allVideos.length + ")</option>" +
        '<option value="__ohne_bunny__"' + (videoFilterStufe === "__ohne_bunny__" ? " selected" : "") + ">Nur ohne Bunny-ID (" +
          allVideos.filter(function(v){ return !v.bunny_video_id; }).length + ")</option>" +
        STUFEN_ORDER.map(function(st){
          const n = allVideos.filter(function(v){ return stufenVonVideo(v).indexOf(st) !== -1; }).length;
          if(n === 0) return "";
          return '<option value="' + esc(st) + '"' + (videoFilterStufe === st ? " selected" : "") + ">" + esc(st) + " (" + n + ")</option>";
        }).join("") +
      "</select>" +
    "</div>" +
    '<div class="section-label">' +
      (videoFilterStufe ? "Gefiltert: " + gefilterteVideos.length + " von " + allVideos.length : "Alle Videos (" + allVideos.length + ")") +
    "</div>" +
    rows;

  // Themen-Suche: filtert die Liste live, damit man bei 60+ Themen nicht scrollen muss
  const tagSuche = document.getElementById("nv-tag-suche");
  function aktualisiereChips(){
    const gewaehlt = Array.from(document.querySelectorAll(".nv-tag-cb:checked"));
    document.getElementById("nv-tag-chips").innerHTML = gewaehlt.map(function(cb){
      return '<span class="themen-chip">' + esc(cb.dataset.label) + '<button data-chipoff="' + esc(cb.value) + '">' + icon("x","ic-s") + "</button></span>";
    }).join("");
    document.querySelectorAll("[data-chipoff]").forEach(function(b){
      b.addEventListener("click", function(){
        const cb = document.querySelector('.nv-tag-cb[value="' + b.dataset.chipoff + '"]');
        if(cb){ cb.checked = false; aktualisiereChips(); }
      });

  }
  if(tagSuche){

      const q = tagSuche.value.toLowerCase().trim();
      document.querySelectorAll(".thema-zeile").forEach(function(z){

        z.style.display = treffer ? "" : "none";
      });

  }
  document.querySelectorAll(".nv-tag-cb").forEach(function(cb){

  });

  document.getElementById("vid-filter").addEventListener("change", function(e){

  });

  document.querySelectorAll("[data-editv]").forEach(function(b){

  });
  document.querySelectorAll("[data-notifyv]").forEach(function(b){
    b.addEventListener("click", function(){ notifyNeuesVideo(b.dataset.notifyv); });
  });
  document.querySelectorAll("[data-rmpr]").forEach(function(b){
    b.addEventListener("click", function(){
      const parts = b.dataset.rmpr.split("|");
      removeVideoPruefer(parts[0], parts[1]);
    });
  });
  document.querySelectorAll("[data-addpr-btn]").forEach(function(b){
    b.addEventListener("click", function(){
      const vid = b.dataset.addprBtn;
      const sel = document.querySelector('[data-addpr-select="' + vid + '"]');
      if(sel && sel.value) addVideoPruefer(vid, sel.value);
    });
  });
}

async function addVideoPruefer(videoId, prueferId){
  if(DEMO_MODE){
    videoPruefer.push({ video_id:videoId, pruefer_id:prueferId });
    renderAdminVideos();
    return;
  }
  const { error } = await supa.from("academy_video_pruefer").insert({ video_id:videoId, pruefer_id:prueferId });
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminVideos();
}

async function removeVideoPruefer(videoId, prueferId){
  if(DEMO_MODE){
    videoPruefer = videoPruefer.filter(function(vp){ return !(vp.video_id === videoId && vp.pruefer_id === prueferId); });
    renderAdminVideos();
    return;
  }
  const { error } = await supa.from("academy_video_pruefer").delete().eq("video_id", videoId).eq("pruefer_id", prueferId);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminVideos();
}

async function editVideoBunnyId(id){
  const v = allVideos.find(function(x){ return x.id === id; });
  if(!v) return;
  const neueId = prompt("Bunny-Video-ID für „" + v.titel + "\" eintragen:", v.bunny_video_id || "");
  if(neueId === null) return;
  const trimmed = neueId.trim();

  if(DEMO_MODE){
    v.bunny_video_id = trimmed || null;
    renderAdminVideos();
    showToast("Bunny-ID aktualisiert (Demo)");
    return;
  }
  const { error } = await supa.from("academy_videos").update({ bunny_video_id: trimmed || null }).eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminVideos();
  showToast("Bunny-ID aktualisiert");
}

async function createVideo(){
  const titel = document.getElementById("nv-titel").value.trim();
  const desc = document.getElementById("nv-desc").value.trim();
  const gewaehlteTags = Array.from(document.querySelectorAll(".nv-tag-cb:checked")).map(function(cb){ return cb.value; });
  const pruefungsergebnis = document.getElementById("nv-pruefungsergebnis").value || null;
  const bunnyId = document.getElementById("nv-bunny").value.trim();
  const gewaehltePruefer = Array.from(document.querySelectorAll(".nv-pruefer-cb:checked")).map(function(cb){ return cb.value; });
  if(!titel){ showToast("Titel ist Pflicht"); return; }
  if(gewaehlteTags.length === 0){ showToast("Bitte mindestens ein Thema auswählen"); return; }

  // --- Bereich 8.10 (27.08.2026): Duplikate abfangen, BEVOR gespeichert wird ---
  // Die Datenbank hat zusätzlich einen Unique-Index auf bunny_video_id; diese
  // Prüfung existiert, damit du eine verständliche Rückfrage bekommst statt
  // einer rohen Datenbank-Fehlermeldung.
  if(bunnyId){
    const bunnyDoppelt = allVideos.find(function(v){ return v.bunny_video_id === bunnyId; });
    if(bunnyDoppelt){
      showToast("Diese Bunny-ID ist schon bei „" + bunnyDoppelt.titel + "“ hinterlegt");
      return;
    }
  }
  const titelDoppelt = allVideos.find(function(v){
    return (v.titel || "").trim().toLowerCase() === titel.toLowerCase();
  });
  if(titelDoppelt && !confirm("Es gibt bereits ein Video mit dem Titel „" + titelDoppelt.titel + "“.\n\nTrotzdem anlegen?")) return;

  const neu = { id:"v" + Date.now(), titel:titel, beschreibung: desc || null, bunny_video_id: bunnyId || null, pruefung_ergebnis: pruefungsergebnis };
  const neuVts = gewaehlteTags.map(function(tagId){ return { video_id: neu.id, tag_id: tagId }; });

  if(DEMO_MODE){
    DEMO_VIDEOS.unshift(neu);
    neuVts.forEach(function(vt){ DEMO_VIDEO_TAGS.push(vt); });
    gewaehltePruefer.forEach(function(pid){ videoPruefer.push({ video_id:neu.id, pruefer_id:pid }); });
    allVideos = DEMO_VIDEOS; videoTags = DEMO_VIDEO_TAGS;
    renderAdminVideos();
    showToast("Video angelegt");
    return;
  }
  const { error } = await supa.from("academy_videos").insert(neu);
  if(error){ showToast("Fehler: " + error.message); return; }
  await supa.from("academy_video_tags").insert(neuVts);
  if(gewaehltePruefer.length){
    await supa.from("academy_video_pruefer").insert(gewaehltePruefer.map(function(pid){ return { video_id:neu.id, pruefer_id:pid }; }));
  }
  await loadAdminData();
  renderAdminVideos();
  showToast("Video angelegt (" + gewaehlteTags.length + " Thema/Themen)");
  notifyNeuesVideo(neu.id); // löst im Hintergrund Push an alle aktiven Schüler aus, blockiert die Admin-Ansicht nicht
}

async function notifyNeuesVideo(videoId){
  try{
    const { data: sessionData } = await supa.auth.getSession();
    const token = sessionData && sessionData.session ? sessionData.session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-notify-new-video", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ video_id: videoId })
    });
    const data = await res.json();
    if(res.ok && data.push_gesendet_an > 0){
      showToast(data.push_gesendet_an + " Schüler benachrichtigt 🔔");
    }
  } catch(e){
    // Push-Versand ist ein Zusatz, kein kritischer Pfad -- Fehler hier nicht störend anzeigen
  }
}

async function deleteVideo(id){
  if(!confirm("Dieses Video wirklich löschen?")) return;
  if(DEMO_MODE){
    DEMO_VIDEOS = DEMO_VIDEOS.filter(function(x){ return x.id !== id; });
    DEMO_VIDEO_TAGS = DEMO_VIDEO_TAGS.filter(function(x){ return x.video_id !== id; });
    videoPruefer = videoPruefer.filter(function(vp){ return vp.video_id !== id; });
    allVideos = DEMO_VIDEOS; videoTags = DEMO_VIDEO_TAGS;
    renderAdminVideos();
    return;
  }
  await supa.from("academy_video_tags").delete().eq("video_id", id);
  await supa.from("academy_video_pruefer").delete().eq("video_id", id);
  const { error } = await supa.from("academy_videos").delete().eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminVideos();
}

async function createFahrlehrer(){
  const name = document.getElementById("nfl-name").value.trim();
  if(!name){ showToast("Name ist Pflicht"); return; }
  const neu = { id:"fl" + Date.now(), name:name, schule_id: myRole === "super_admin" ? null : mySchule };

async function deleteFahrlehrer(id){

    allFahrlehrer = DEMO_FAHRLEHRER;
    renderAdminFahrlehrer();

  renderAdminFahrlehrer();

/* =========================================================
   Bereich 8.7 (27.08.2026) — Änderungsprotokoll.
   Nicht zu verwechseln mit renderAdminHistorie: das ist die
   Video-Historie je Schüler. Hier geht es um Admin-Handlungen
   (gesperrt, gelöscht, verlängert, freigeschaltet).
   Bewusst "leise": ein fehlgeschlagener Protokolleintrag darf

async function protokolliere(aktion, objektTyp, objektId, objektName, details){
  if(DEMO_MODE) return;

      akteur: (adminSession && adminSession.email) ? adminSession.email : "Admin",
      aktion: aktion,
      objekt_typ: objektTyp,
      objekt_id: objektId || null,
      objekt_name: objektName || null,
      details: details || null
    });
  } catch(e){ /* Protokoll ist Beiwerk, kein Blocker */ }
}

async function renderAdminProtokoll(){

  el.innerHTML = '<div class="loading">Protokoll wird geladen …</div>';

/* =========================================================
   Bereich 8.4 — Kandidaten: alle bekannten Schüler an einem Ort,
   mit Suche, A–Z-Sprungleiste und Ein-Klick-Freischaltung.
   ========================================================= */
async function ladeKandidaten(){
  if(DEMO_MODE){ allKandidaten = []; return; }
  const res = await supa.from("academy_kandidaten").select("*");
  allKandidaten = res.data || [];
}

function kandidatenGefiltert(){
  const suche = kandidatenSuche.trim().toLowerCase();
  const sucheNorm = suche.replace(/[\s\-\/]/g, "");
  return allKandidaten
    .filter(function(k){
      if(kandidatenNurOffen && k.konvertiert_am) return false;
      if(!suche) return true;
      const telNorm = (k.telefon || "").replace(/[\s\-\/]/g, "");
      return (k.name || "").toLowerCase().includes(suche)
        || (k.email || "").toLowerCase().includes(suche)
        || (sucheNorm.length > 0 && telNorm.includes(sucheNorm));
    })
    .sort(function(a,b){ return (a.name||"").localeCompare(b.name||"", "de"); });
}

function renderAdminKandidaten(){
  const liste = kandidatenGefiltert();
  const offenGesamt = allKandidaten.filter(function(k){ return !k.konvertiert_am; }).length;

  // A–Z-Leiste: nur Buchstaben anbieten, zu denen es wirklich jemanden gibt
  const vorhanden = new Set(liste.map(function(k){ return (k.name || "?").trim().charAt(0).toUpperCase(); }));
  const azLeiste = '<div class="az-leiste">' +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(function(b){
      const aktiv = vorhanden.has(b);
      return '<span class="az-buchstabe' + (aktiv ? "" : " az-leer") + '"' +
        (aktiv ? ' data-az="' + b + '"' : "") + ">" + b + "</span>";
    }).join("") +
  "</div>";

  let letzter = "";
  const zeilen = liste.map(function(k){
    const b = (k.name || "?").trim().charAt(0).toUpperCase();
    let kopf = "";
    if(b !== letzter){ letzter = b; kopf = '<div class="az-kopf" id="az-' + esc(b) + '">' + esc(b) + "</div>"; }
    const hatZugang = !!k.konvertiert_am;
    const badge = hatZugang
      ? '<span class="admin-badge badge-aktiv">Zugang aktiv</span>'
      : '<span class="admin-badge badge-gesperrt">offen</span>';
    const aktion = hatZugang ? ""
      : (!k.email
          ? '<button class="btn-klein btn-warn" data-kmail="' + esc(k.id) + '">E-Mail nachtragen</button>'
          : '<button class="btn-klein" data-kfrei="' + esc(k.id) + '">Zugang freischalten</button>');
    return kopf +
      '<div class="admin-card glass">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<div class="admin-name" style="flex:1;min-width:120px;">' + esc(k.name) + "</div>" + badge +
        "</div>" +
        '<div class="admin-sub">' + esc(k.telefon) +
          (k.email ? " · " + esc(k.email) : ' · <span style="color:var(--gold);">keine E-Mail hinterlegt</span>') +
          (k.klasse ? " · Klasse " + esc(k.klasse) : "") + "</div>" +
        (k.quelle ? '<div class="admin-sub" style="opacity:.6;">Quelle: ' + esc(k.quelle) + "</div>" : "") +
        (aktion ? '<div style="margin-top:8px;">' + aktion + "</div>" : "") +
      "</div>";
  }).join("") || '<div class="empty">Keine Treffer.</div>';

  document.getElementById("admin-content").innerHTML =
    '<div class="admin-card glass" style="margin-bottom:12px;">' +
      '<div class="admin-form-title" style="margin-bottom:4px;">Kandidaten</div>' +
      '<div class="admin-sub" style="margin-bottom:10px;">' + offenGesamt + " ohne Zugang · " + allKandidaten.length + " insgesamt</div>" +
      '<input id="kand-suche" type="text" placeholder="Name, Telefon oder E-Mail suchen …" value="' + esc(kandidatenSuche) + '">' +
      '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">' +
        '<input type="checkbox" id="kand-offen"' + (kandidatenNurOffen ? " checked" : "") + "> Nur ohne Zugang zeigen</label>" +
      // Der Abgleich läuft ohnehin jede Nacht automatisch -- dieser Knopf ist nur
      // für den Fall, dass du gerade jemanden in Kompass angelegt hast.
      '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
        '<button class="btn-klein" id="kand-sync">Jetzt mit Kompass abgleichen</button>' +
        '<span class="admin-sub" style="margin:0;">Läuft automatisch jede Nacht</span>' +
      "</div>" +
    "</div>" + azLeiste + zeilen;

  const s = document.getElementById("kand-suche");
  s.addEventListener("input", function(){
    kandidatenSuche = s.value;
    const pos = s.selectionStart;
    renderAdminKandidaten();
    const n = document.getElementById("kand-suche");
    n.focus(); n.setSelectionRange(pos, pos); // sonst springt die Tastatur bei jedem Zeichen zu
  });
  document.getElementById("kand-offen").addEventListener("change", function(e){
    kandidatenNurOffen = e.target.checked; renderAdminKandidaten();
  });
  document.querySelectorAll("[data-az]").forEach(function(b){
    b.addEventListener("click", function(){
      const z = document.getElementById("az-" + b.dataset.az);
      if(z) z.scrollIntoView({ behavior:"smooth", block:"start" });
    });
  });
  document.querySelectorAll("[data-kfrei]").forEach(function(b){
    b.addEventListener("click", function(){ kandidatFreischalten(b.dataset.kfrei, b); });
  });
  document.querySelectorAll("[data-kmail]").forEach(function(b){
    b.addEventListener("click", function(){ kandidatMailNachtragen(b.dataset.kmail); });
  });
  const syncBtn = document.getElementById("kand-sync");
  if(syncBtn) syncBtn.addEventListener("click", function(){ kandidatenAbgleichen(syncBtn); });
}

/* Bereich 8.4 — manueller Anstoß des Kompass-Abgleichs.
   Dieselbe Funktion, die nachts per Cron läuft; hier nur mit Admin-Anmeldung
   statt mit dem Brücken-Geheimnis. */
async function kandidatenAbgleichen(btn){
  const alterText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Wird abgeglichen …";
  try{
    const { data: sess } = await supa.auth.getSession();
    const token = sess && sess.session ? sess.session.access_token : null;
    if(!token){ showToast("Sitzung abgelaufen — bitte neu einloggen"); return; }

    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-kandidaten-sync", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({})
    });
    const data = await res.json();

    if(!res.ok){
      // Klartext statt Fehlercode, damit du sofort weißt, wo es hakt
      const meldungen = {
        kompass_export_url_fehlt: "Die Export-Adresse von Kompass ist noch nicht hinterlegt.",
        kompass_nicht_erreichbar: "Kompass war nicht erreichbar. Läuft die Schnittstelle dort schon?",
        kompass_fehler: "Kompass hat mit einem Fehler geantwortet (HTTP " + (data.status || "?") + ").",
        antwort_ohne_schueler_array: "Kompass hat geantwortet, aber ohne Schülerliste.",
        unauthorized: "Keine Berechtigung für den Abgleich."
      };
      alert(meldungen[data.error] || ("Abgleich fehlgeschlagen: " + (data.error || "unbekannt")));
      return;
    }

    let txt = "Abgleich fertig.\n\n" + data.zusammenfassung;
    if(data.probleme && data.probleme.length > 0){
      txt += "\n\nÜbersprungen:\n" + data.probleme.slice(0,10).join("\n");
    }
    alert(txt);

    await ladeKandidaten();
    renderAdminKandidaten();
  } catch(e){
    showToast("Verbindungsfehler beim Abgleich");
  } finally {
    btn.disabled = false;
    btn.textContent = alterText;
  }
}

async function kandidatMailNachtragen(kandId){
  const k = allKandidaten.find(function(x){ return x.id === kandId; });
  if(!k) return;
  const mail = prompt("E-Mail-Adresse für " + k.name + ":", k.email || "");
  if(mail === null) return;
  const sauber = mail.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(sauber)){ showToast("Keine gültige E-Mail-Adresse"); return; }
  const res = await supa.from("academy_kandidaten").update({ email: sauber }).eq("id", kandId);
  if(res.error){ showToast("Fehler: " + res.error.message); return; }
  await protokolliere("kandidat_email_ergaenzt", "kandidat", kandId, k.name, sauber);
  await ladeKandidaten();
  renderAdminKandidaten();
  showToast("E-Mail gespeichert");
}

async function kandidatFreischalten(kandId, btn){
  const k = allKandidaten.find(function(x){ return x.id === kandId; });
  if(!k) return;
  if(!confirm("Zugang für " + k.name + " freischalten?\n\nEs wird eine PIN erzeugt und an " + k.email + " geschickt.")) return;

  btn.disabled = true;
  const alterText = btn.textContent;
  btn.textContent = "Wird freigeschaltet …";
  try{
    const { data: sess } = await supa.auth.getSession();
    const token = sess && sess.session ? sess.session.access_token : null;
    if(!token){ showToast("Sitzung abgelaufen — bitte neu einloggen"); return; }

    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-zugang-aktivieren", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ kandidat_id: kandId })
    });
    const data = await res.json();
    if(!res.ok){ alert("Fehler: " + (data.error || "unbekannt")); return; }

    let txt = "Zugang für " + data.name + " ist aktiv.\n\nPIN: " + data.pin;
    if(data.mail === "gesendet") txt += "\n\nPIN-Mail wurde verschickt.";
    else if(data.mail === "keine_email_hinterlegt") txt += "\n\nKeine E-Mail hinterlegt — PIN bitte selbst weitergeben.";
    else txt += "\n\nMail konnte NICHT verschickt werden (" + data.mail + ") — PIN bitte selbst weitergeben.";
    if(data.empfehlung === "eingeloest") txt += "\nEine wartende Kompass-Empfehlung wurde übernommen.";
    alert(txt);

    await ladeKandidaten();
    await loadAdminData();
    renderAdminKandidaten();
  } catch(e){
    showToast("Verbindungsfehler");
  } finally {
    btn.disabled = false;
    btn.textContent = alterText;
  }
}

/* =========================================================
   Bereich 7.9 — Klassen-Freischaltung.
   Themen mit nur_klasse bleiben für Schüler gesperrt (sichtbar,
   mit Hinweis), bis hier freigegeben wird. Standard: alles zu.
   ========================================================= */
async function renderKlassenFreigabe(zielId){

  const res = await supa.from("academy_klassen_freigabe").select("*").order("klasse");
  const klassen = res.data || [];
  if(klassen.length === 0) return;

  el.innerHTML =
    '<div class="admin-form glass" style="margin-top:12px;">' +
      '<div class="admin-form-title">Klassen-Inhalte freischalten</div>' +
      '<div class="admin-sub" style="margin-bottom:10px;">Themen, die einer Klasse zugeordnet sind, bleiben für Schüler gesperrt, bis du sie hier freigibst. Sie sind trotzdem sichtbar — mit dem Hinweis, dass sie bei der Fahrschule freigeschaltet werden können.</div>' +
      klassen.map(function(k){
        return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:400;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text);">' +
          '<input type="checkbox" class="klasse-cb" value="' + esc(k.klasse) + '"' + (k.freigegeben ? " checked" : "") + "> Klasse " + esc(k.klasse) +

        "</label>";
      }).join("") +

  el.querySelectorAll(".klasse-cb").forEach(function(cb){
    cb.addEventListener("change", async function(){
      const { error } = await supa.from("academy_klassen_freigabe")
        .update({ freigegeben: cb.checked, geaendert_am: new Date().toISOString() })
        .eq("klasse", cb.value);
      if(error){
        showToast("Fehler: " + error.message);
        cb.checked = !cb.checked; // Anzeige zurücksetzen, damit sie zum echten Stand passt
        return;
      }
      await protokolliere(cb.checked ? "klasse_freigeschaltet" : "klasse_gesperrt", "klasse", cb.value, "Klasse " + cb.value, null);
      showToast("Klasse " + cb.value + (cb.checked ? " freigeschaltet" : " gesperrt"));
      renderKlassenFreigabe(zielId);
    });
  });
}

/* =========================================================
   Bereich 8.2 — Sammelaktionen für mehrere Schüler.
   Einzelne Updates statt Sammel-Update: so scheitert bei einem
   Problem nur ein Schüler, und jede Änderung landet einzeln
   nachvollziehbar im Protokoll.
   ========================================================= */
async function bulkVerlaengern(){
  const ids = Array.from(bulkAuswahl);
  if(ids.length === 0) return;
  if(!confirm(ids.length + " Zugang/Zugänge um 6 Monate verlängern?")) return;

  let ok = 0, fehler = 0;
  for(const id of ids){
    const s = allSchueler.find(function(x){ return x.id === id; });
    if(!s){ fehler++; continue; }
    // Ab heute rechnen, wenn schon abgelaufen — sonst ab bisherigem Ablaufdatum.
    // Verhindert, dass eine Verlängerung in der Vergangenheit landet.
    const basis = new Date(s.ablauf_am) > new Date() ? new Date(s.ablauf_am) : new Date();
    basis.setMonth(basis.getMonth() + 6);
    if(DEMO_MODE){ s.ablauf_am = basis.toISOString(); ok++; continue; }
    const { error } = await supa.from("academy_schueler").update({ ablauf_am: basis.toISOString() }).eq("id", id);
    if(error){ fehler++; continue; }
    await protokolliere("zugang_verlaengert", "schueler", id, s.name, "neu gültig bis " + basis.toISOString().slice(0,10));
    ok++;
  }
  bulkAuswahl.clear();
  if(!DEMO_MODE) await loadAdminData();
  renderAdminSchueler();
  showToast(ok + " verlängert" + (fehler ? ", " + fehler + " fehlgeschlagen" : ""));
}

async function bulkSperrenSetzen(aktiv){
  const ids = Array.from(bulkAuswahl);
  if(ids.length === 0) return;
  if(!confirm(ids.length + " Zugang/Zugänge " + (aktiv ? "entsperren" : "sperren") + "?")) return;

  let ok = 0, fehler = 0;
  for(const id of ids){
    const s = allSchueler.find(function(x){ return x.id === id; });
    if(!s){ fehler++; continue; }
    if(DEMO_MODE){ s.aktiv = aktiv; ok++; continue; }
    const { error } = await supa.from("academy_schueler").update({ aktiv: aktiv }).eq("id", id);
    if(error){ fehler++; continue; }
    await protokolliere(aktiv ? "schueler_entsperrt" : "schueler_gesperrt", "schueler", id, s.name, "Sammelaktion");
    ok++;
  }
  bulkAuswahl.clear();
  if(!DEMO_MODE) await loadAdminData();
  renderAdminSchueler();
  showToast(ok + " " + (aktiv ? "entsperrt" : "gesperrt") + (fehler ? ", " + fehler + " fehlgeschlagen" : ""));
}

async function createSchule(){
  const name = document.getElementById("nsch-name").value.trim();
  const email = document.getElementById("nsch-email").value.trim();
  if(!name || !email){ showToast("Name und E-Mail sind Pflicht"); return; }
  const schuleId = "schule_" + Date.now();

  if(DEMO_MODE){
    allSchulen.push({ id:schuleId, name:name, aktiv:true });
    showToast("(Demo) Schule angelegt — im echten Modus würde jetzt ein Login per Mail-Adresse erzeugt");
    renderAdminSchulen();
    return;
  }

  try{
    const { data: sessionData } = await supa.auth.getSession();
    const token = sessionData && sessionData.session ? sessionData.session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-create-schuladmin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ schule_id: schuleId, schule_name: name, email: email })
    });
    const data = await res.json();
    if(!res.ok){ showToast("Fehler: " + (data.error || "unbekannt")); return; }

    await loadAdminData();
    renderAdminSchulen();
    showToast("Schule angelegt. Login-Daten unten notieren!");
    document.getElementById("admin-content").insertAdjacentHTML("afterbegin",
      '<div class="admin-card glass" style="border-color:var(--gold);">' +
        '<div class="admin-form-title">Neuer Schul-Login (nur jetzt sichtbar!)</div>' +
        '<div class="admin-sub">E-Mail: <strong>' + esc(data.email) + '</strong></div>' +
        '<div class="admin-sub">Passwort: <span class="pin-display">' + esc(data.password) + '</span></div>' +
      "</div>"
    );
  } catch(e){
    showToast("Verbindungsfehler beim Anlegen der Schule");
  }
}

async function toggleSchule(id){
  const s = allSchulen.find(function(x){ return x.id === id; });
  if(!s) return;
  s.aktiv = !s.aktiv;

  if(DEMO_MODE){
    renderAdminSchulen();
    return;
  }
  const { error } = await supa.from("academy_schulen").update({ aktiv: s.aktiv }).eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  renderAdminSchulen();
}

// Service Worker registrieren — nötig, damit Android das Icon aus der
// manifest.json beim "Zum Startbildschirm hinzufügen" übernimmt, statt
// des Standard-Chrome-Symbols.
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

init();
</script>
