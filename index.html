<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahr-Akademie</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fahr-Akademie">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F0E3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* ---- DESIGN-TOKENS (Bereich 2, Punkt 1-3) ----
     Zentrale Werte für Farbe/Abstand/Radius/Schrift. Neue Bausteine greifen
     ausschließlich hierauf zu, damit spätere Änderungen an EINER Stelle passieren. */
  :root{
    --gruen:#2F4A34; --gruen-hell:#4B7A56; --bg:#F5F0E3; --bg-2:#F5F0E3;
    --surface:#FBF8F1; --surface-strong:#EFE8D6; --surface-tint:#E3EADD;
    --border:rgba(43,40,30,0.10); --text:#2B2A22; --muted:#8A8272; --faint:#AFA68F;
    --gold:#D9954C;
    /* Gold ist ab jetzt reserviert für "Aktion / wichtig / geschafft" (Punkt 8) */
    --gold-schwach:rgba(217,149,76,.15); --gold-rand:rgba(217,149,76,.35);
    /* Abstände */
    --sp-xs:4px; --sp-s:8px; --sp-m:12px; --sp-l:18px; --sp-xl:26px;
    /* Radien */
    --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
    /* Typografie-Hierarchie (Punkt 2) */
    --fs-titel:20px; --fs-karte:16px; --fs-body:14px; --fs-meta:12px;
    --fw-titel:700; --fw-karte:600; --fw-body:400;
    /* Schatten */
    --schatten-karte:0 2px 10px rgba(43,40,30,.05);
    /* Papierbogen (Bereich 2, 27.08.2026): Außenfläche etwas tiefer als das
       "Papier" selbst, damit auf breiten Bildschirmen eine sichtbare Kante entsteht. */
    --bogen-aussen:#EAE3D2; --bogen-kante:rgba(43,40,30,.10);
  }
  /* Dark Mode (Punkt 10): folgt der Systemeinstellung des Geräts.
     Bewusst als eigenes Farbschema, nicht als reine Invertierung. */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1A1E1B; --bg-2:#1A1E1B;
      --surface:#242A25; --surface-strong:#2E362F; --surface-tint:#2A332B;
      --border:rgba(245,240,227,0.12); --text:#EDE7D9; --muted:#A39A87; --faint:#7E7768;
      --gruen-hell:#7FA98A;
      --gold:#E0A868; --gold-schwach:rgba(224,168,104,.18); --gold-rand:rgba(224,168,104,.4);
      --schatten-karte:0 2px 10px rgba(0,0,0,.3);
      /* Im Dunkelmodus umgekehrt: Außen dunkler als das Papier, sonst würde der
         Bogen im Dunkeln "leuchten" statt sich ruhig abzusetzen. */
      --bogen-aussen:#12150F; --bogen-kante:rgba(245,240,227,.10);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:'Barlow',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 0;min-height:100vh;}
  .page-content{padding-bottom:90px;}

  /* ---- Bereich 10.5: Sprachauswahl im Konto ---- */
  .sprach-reihe{display:flex;flex-wrap:wrap;gap:8px;}
  .sprach-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:var(--r-m);padding:11px 16px;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;min-height:44px;}
  .sprach-btn.aktiv{background:var(--gruen);color:#fff;border-color:var(--gruen);}
  /* Bereich 10.9 vorbereitet: bei Arabisch dreht sich die Leserichtung. Nur die
     Ausrichtung anpassen -- Zahlen, Fortschrittsbalken und Symbole bleiben wie sie sind. */
  [dir="rtl"] body{ text-align:right; }
  [dir="rtl"] .admin-row, [dir="rtl"] .sprach-reihe{ flex-direction:row-reverse; }

  /* ---- Bereich 2 (27.08.2026): "Papierbogen"-Layout auf breiten Bildschirmen ----
     Problem vorher: Auf Tablet/Desktop stand der Inhalt in einer 720px-Spalte, aber
     der Bereich links und rechts hatte GENAU dieselbe Farbe. Ohne Kante wirkten die
     Kacheln, als würden sie im Nichts schweben.
     Lösung: Außenfläche bekommt einen eigenen, etwas tieferen Ton, die Spalte wird
     zur sichtbaren Fläche mit Rändern -- wie ein Blatt Papier auf einem Tisch.
     Gilt für ALLE Ansichten (Start, Bereiche, Lernpfad, Prüfer, Verlauf, Konto,
     Admin, Login), weil #app der gemeinsame Container von allem ist.
     Greift bewusst erst ab 760px: am Handy füllt die Spalte ohnehin den Bildschirm,
     dort wäre ein Rahmen nur störend. */
  /* ---- Bereich 2 (27.08.2026, überarbeitet): "Papierbogen" mit klaren Kanten ----
     Erster Versuch hatte nur Ränder links und rechts -- oben und unten lief das
     Papier einfach aus dem Bild, was den Eindruck kaputt machte.
     Jetzt bekommt der Bogen eine feste Höhe und scrollt IN SICH. Dadurch bleiben
     alle vier Kanten dauerhaft sichtbar: das Blatt liegt wirklich auf dem Tisch,
     statt an zwei Seiten wegzulaufen.
     Die Fußleiste wird dabei von "fixed am Bildschirm" zu "sticky im Bogen" --
     sonst würde sie über die untere Papierkante hinausragen.
     Greift bewusst erst ab 760px: am Handy füllt die Spalte den Bildschirm,
     dort wäre ein Rahmen nur störend. */
  @media (min-width:760px){
    body{
      background:var(--bogen-aussen);
      padding:22px 0;
      display:flex; justify-content:center;
      height:100vh; overflow:hidden;   /* die Seite selbst scrollt nicht mehr */
    }
    #app{
      width:100%; max-width:720px;
      height:100%; min-height:0;
      overflow-y:auto;                 /* gescrollt wird jetzt hier drin */
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      background:var(--bg);
      border:1px solid var(--bogen-kante);
      border-radius:20px;
      box-shadow:0 10px 44px rgba(43,40,30,.14);
      padding:22px 28px 0;
      position:relative;
    }
    /* Fußleiste klebt am unteren Rand des Bogens und übernimmt dessen Ecken.
       Die negativen Ränder heben die Innenabstände von #app auf, damit sie
       exakt bis an die Papierkante reicht. */
    .bottom-nav{
      position:sticky; bottom:0; left:auto; right:auto;
      max-width:none; width:auto;
      margin:0 -28px 0; 
      border-radius:0 0 19px 19px;
      border-top:1px solid var(--bogen-kante);
    }
    /* Der Freiraum für die vormals schwebende Leiste wird nicht mehr gebraucht. */
    .page-content{ padding-bottom:var(--sp-l); }
    /* Der Admin-Balken sitzt ganz oben im Bogen und darf dessen Ecken nicht überlaufen. */
    .admin-balken{ margin:-22px -28px 0; border-radius:19px 19px 0 0; }
    /* Dezente Bildlaufleiste, damit sie den Papiereindruck nicht stört */
    #app::-webkit-scrollbar{ width:10px; }
    #app::-webkit-scrollbar-thumb{ background:var(--border); border-radius:var(--r-pill);
      border:3px solid var(--bg); }
    #app::-webkit-scrollbar-track{ background:transparent; }
  }

  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
    border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(43,40,30,.06);
    max-width:720px;margin:0 auto;z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav-item{
    flex:1;text-align:center;padding:13px 2px;border-radius:14px;color:var(--muted);
    font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;
    min-height:44px;display:flex;align-items:center;justify-content:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bottom-nav-item.active{background:var(--surface-tint);color:var(--gruen);}

  h1{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:0;font-size:30px;margin:0;}
  .tagline{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;color:var(--gruen-hell);font-size:16px;margin:2px 0 0;}

  .glass{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    box-shadow:0 2px 10px rgba(43,40,30,.05);
  }

  .logo-img{width:64px;height:64px;border-radius:16px;display:block;box-shadow:0 6px 20px rgba(43,40,30,.18);}

  /* ---------- LOGIN ---------- */
  .login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .login-screen .logo-img{width:88px;height:88px;margin:0 auto 18px;}
  .login-card{width:100%;max-width:340px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;margin-top:22px;}
  .login-card input{
    background:var(--surface-strong);border:1px solid var(--border);color:var(--text);
    padding:15px 16px;border-radius:14px;font-size:17px;text-align:center;font-family:'Barlow',sans-serif;
    letter-spacing:.02em;
  }
  .login-card input::placeholder{color:var(--faint);}
  .pw-field{position:relative;display:flex;}
  .pw-field input{flex:1;padding-right:44px;}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;font-size:18px;cursor:pointer;padding:8px;
    line-height:1;color:var(--muted);
  }
  .btn-primary{
    background:var(--gruen);color:#fff;border:none;
    padding:15px;border-radius:100px;font-size:16.5px;font-weight:700;cursor:pointer;
    font-family:'Barlow',sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px rgba(47,74,52,.25);
  }
  .btn-primary:active{transform:translateY(1px);}
  .err{color:#b5573f;font-size:13.5px;min-height:16px;}
  .demo-badge{
    display:inline-block;margin-top:16px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
    background:rgba(217,149,76,.15);color:var(--gold);border:1px solid rgba(217,149,76,.35);letter-spacing:.03em;
  }

  /* ---------- HEADER / CATALOG ---------- */
  /* Bereich "Fließen" (24.08.2026): jeder neu gerenderte Inhalt blendet sanft ein,
     statt hart zu wechseln -- .page-content und .player-wrap sind bei jedem Render
     frisch erzeugte DOM-Knoten, daher spielt die Animation bei jedem Wechsel neu ab. */
  @keyframes contentIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .page-content{animation:contentIn .28s ease;}
  .player-wrap{animation:contentIn .3s ease;}
  #admin-content{animation:contentIn .28s ease;}

  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .header .logo-img{width:44px;height:44px;flex-shrink:0;}
  .logo-center-btn{background:none;border:none;padding:4px;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;}
  .logo-center-btn:active{transform:scale(0.92);}
  .header-spacer{width:34px;flex-shrink:0;}
  .header-txt-center{text-align:center;margin-bottom:16px;}
  .header-txt-center h1{font-size:21px;margin:0;}
  .header-txt{flex:1;}
  .header-txt h1{font-size:21px;}
  .progress-line{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .logout{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:12px;
    padding:9px 13px;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;}
  .back{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;
    padding:10px 16px;font-size:14px;cursor:pointer;margin-bottom:14px;font-family:'Barlow',sans-serif;font-weight:600;}

  .section-label{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 2px 8px;}
  .stufe-row,.tag-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--surface);border:1px solid var(--border);color:var(--muted);
    padding:9px 15px;border-radius:24px;font-size:13.5px;cursor:pointer;white-space:nowrap;
    font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s;
  }
  .chip.active{background:var(--gruen);border-color:var(--gruen-hell);color:#fff;box-shadow:0 4px 14px rgba(47,74,52,.25);}
  .tag-chip .ort{opacity:.75;font-weight:400;font-size:11.5px;}

  .video-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .video-card{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;}
  .video-card:active{background:var(--surface-strong);}
  .video-play-ic{
    width:38px;height:38px;border-radius:50%;background:var(--gruen);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
  }
  .video-title{font-weight:700;font-size:15px;font-family:'Barlow',sans-serif;}
  .video-desc{color:var(--muted);font-size:13px;margin-top:2px;}
  .video-check{margin-left:auto;color:var(--gruen-hell);font-size:18px;flex-shrink:0;}
  .empty{color:var(--faint);text-align:center;padding:50px 20px;font-size:14.5px;}

  /* ---------- LERNPFAD (Stufen-Akkordeon) ---------- */
  .stufe-section{margin-bottom:12px;}
  .stufe-header{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;
  }
  .stufe-header.open{border-color:var(--gruen-hell);}
  .stufe-header-left{display:flex;align-items:center;gap:10px;}
  .stufe-caret{color:var(--faint);font-size:13px;width:12px;display:inline-block;}
  .stufe-name{font-weight:700;font-size:15px;font-family:'Barlow',sans-serif;}
  .video-code{
    min-width:38px;height:38px;border-radius:12px;background:var(--gruen);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;
  }
  .stufe-section .video-list{margin-top:8px;}

  .video-card.highlight-target{
    border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,149,76,.35);
    animation:dlPulse 1.8s ease-in-out 2;
  }
  .vg-card.highlight-target{
    outline:3px solid var(--gold); outline-offset:2px;
    animation:dlPulse 1.8s ease-in-out 2;
  }
  @keyframes dlPulse{
    0%,100%{box-shadow:0 0 0 2px rgba(217,149,76,.35);}
    50%{box-shadow:0 0 0 5px rgba(217,149,76,.15);}
  }

  .loading{text-align:center;padding:80px 0;color:var(--muted);font-size:14.5px;}

  /* ---------- PLAYER ---------- */
  .player-wrap{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .demo-player{
    aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--muted);text-align:center;padding:24px;
  }
  .demo-player .big-ic{font-size:38px;}

  /* ---------- ADMIN ---------- */
  .admin-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .admin-tab{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:var(--surface);
    border:1px solid var(--border);color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:'Barlow',sans-serif;}
  .admin-tab.active{background:var(--gruen);color:#fff;border-color:var(--gruen-hell);}
  .admin-card{padding:14px 16px;margin-bottom:10px;}
  .admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .admin-name{font-weight:700;font-size:14.5px;}
  .admin-sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .admin-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:14px;white-space:nowrap;}
  /* ---- Bereich 7+8 (27.08.2026) ---- */
  /* Kompakte Aktions-Buttons in Listen */
  .btn-klein{background:var(--gruen);color:#fff;border:none;border-radius:8px;
    padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-klein:disabled{opacity:.55;cursor:default;}
  .btn-klein.btn-warn{background:var(--gold);}
  /* 8.4: A–Z-Sprungleiste über der Kandidatenliste */
  .az-leiste{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:8px 4px;
    margin-bottom:10px;position:sticky;top:0;z-index:5;background:var(--bg);border-radius:10px;}
  .az-buchstabe{font-size:12px;font-weight:700;padding:4px 6px;border-radius:5px;cursor:pointer;
    color:var(--gruen);min-width:20px;text-align:center;}
  .az-buchstabe:active{background:var(--gold);color:#fff;}
  .az-buchstabe.az-leer{opacity:.22;cursor:default;}
  .az-kopf{font-weight:700;font-size:13px;color:var(--gold);margin:14px 0 6px;letter-spacing:1px;}
  /* 8.2: Mehrfachauswahl */
  .bulk-pick{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.7;margin-bottom:6px;}
  .bulk-leiste{border:2px solid var(--gold) !important;position:sticky;top:0;z-index:6;}
  /* 8.5: Ablauf-Vorwarnung */
  .warn-ablauf{color:var(--gold);font-weight:600;}
  /* 7.9: gesperrte Klassen-Inhalte */
  .video-locked{opacity:.62;cursor:default;}
  .lock-hint{color:var(--gold);font-size:12px;margin-top:2px;}
  /* 7.1/7.2: Empfehlung aus dem Kompass */
  .empf-card{border:2px solid var(--gold) !important;}
  .empf-badge{display:inline-block;background:var(--gold);color:#fff;font-size:11px;
    font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:10px;margin-bottom:8px;}
  .badge-aktiv{background:rgba(75,122,86,.15);color:var(--gruen-hell);border:1px solid rgba(75,122,86,.3);}
  .badge-abgelaufen{background:rgba(217,149,76,.15);color:#b5732f;border:1px solid rgba(217,149,76,.35);}
  .badge-gesperrt{background:var(--surface-strong);color:var(--muted);border:1px solid var(--border);}
  .admin-form{display:flex;flex-direction:column;gap:10px;padding:16px;margin-bottom:18px;}
  .admin-form input:not([type="checkbox"]),.admin-form select{
    background:var(--surface-strong);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:14.5px;font-family:'Barlow',sans-serif;width:100%;
  }
  .admin-form input[type="checkbox"]{width:18px;height:18px;flex:none;accent-color:var(--gruen);}
  .admin-form label{font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px;}
  .admin-form-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  .icon-btn{background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px 8px;}

  /* ---- Bereich 10.7 (27.08.2026): Tap-Ziele mindestens 44px ----
     Empfehlung von Apple und Google: alles Antippbare mind. 44x44px, sonst
     trifft man mit dem Daumen daneben. Kritisch war .icon-btn (~24px) -- das
     sind ausgerechnet Sperren und Löschen im Admin, wo ein Fehlgriff wehtut.
     Die Fläche wächst, das Symbol bleibt optisch gleich groß. */
  .icon-btn{
    min-width:44px; min-height:44px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-klein{ min-height:44px; }
  .logout{ min-height:44px; }
  .krumen{ min-height:44px; }
  /* Ankreuzfelder sind im Original winzig -- vergrößern, ohne das Layout zu sprengen */
  input[type="checkbox"]{ width:22px; height:22px; accent-color:var(--gruen); }
  .bulk-pick, .klasse-cb-label{ min-height:44px; }
  /* A–Z-Leiste: 26 Buchstaben nebeneinander können keine 44px haben, sonst passt
     die Leiste auf keinen Bildschirm. Kompromiss: deutlich größer als vorher und
     lückenlos aneinander, sodass kein toter Raum zwischen den Zielen bleibt. */
  .az-buchstabe{ min-width:30px; min-height:34px; display:inline-flex;
    align-items:center; justify-content:center; padding:0; }
  .icon-btn.danger{color:#b5573f;}
  .pin-display{font-family:monospace;font-size:15px;letter-spacing:.1em;color:var(--gold);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gruen);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(43,40,30,.25);
    z-index:50;font-family:'Barlow',sans-serif;}
  /* ================= BEREICH 1 + 2: NEUE BAUSTEINE (24.08.2026) ================= */

  /* --- Icons (Punkt 2.4): echte SVGs statt Emoji, erben die Textfarbe --- */
  .ic{width:18px;height:18px;display:inline-block;vertical-align:-3px;stroke:currentColor;
      fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic-s{width:15px;height:15px;vertical-align:-2px;}

  /* --- Einheitlicher Karten-Baustein (Punkt 2.5) --- */
  .karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
         box-shadow:var(--schatten-karte);padding:var(--sp-m);}

  /* --- "Weitermachen"-Karte auf dem Start-Tab (Punkt 1.2) --- */
  .weiter-karte{display:flex;align-items:center;gap:var(--sp-m);background:var(--gruen);
    color:#fff;border-radius:var(--r-l);padding:var(--sp-m) var(--sp-l);margin-bottom:var(--sp-l);
    cursor:pointer;box-shadow:0 6px 18px rgba(47,74,52,.2);}
  .weiter-karte .wk-play{width:42px;height:42px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#2B2A22;}
  .weiter-karte .wk-label{font-size:var(--fs-meta);opacity:.8;letter-spacing:.06em;text-transform:uppercase;}
  .weiter-karte .wk-titel{font-size:var(--fs-karte);font-weight:var(--fw-karte);line-height:1.25;}

  /* --- Bereichs-Chips mit Fortschrittsring (Punkt 1.5) --- */
  .bereich-leiste{display:flex;gap:var(--sp-m);overflow-x:auto;padding:var(--sp-xs) 2px var(--sp-m);
    scrollbar-width:none;-ms-overflow-style:none;}
  .bereich-leiste::-webkit-scrollbar{display:none;}
  .bereich-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:var(--sp-xs);

  .bereich-chip .ring svg{transform:rotate(-90deg);}
  .bereich-chip .ring .ring-icon{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--gruen);}
  .bereich-chip .chip-name{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .bereich-chip.aktiv .chip-name{color:var(--gruen);font-weight:600;}

  /* --- Suchleiste (Punkt 1.4) --- */
  .suchzeile{display:flex;align-items:center;gap:var(--sp-s);background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r-pill);padding:9px var(--sp-m);
    margin-bottom:var(--sp-s);}
  .suchzeile input{flex:1;border:none;background:none;outline:none;font-family:inherit;
    font-size:16px;color:var(--text);min-width:0;}
  .suchzeile input::placeholder{color:var(--faint);}
  .such-clear{background:none;border:none;color:var(--faint);cursor:pointer;padding:0;display:none;}
  .such-clear.sichtbar{display:block;}

  /* --- Status-Filter-Chips (Punkt 1.6) --- */
  .status-filter{display:flex;gap:var(--sp-s);margin-bottom:var(--sp-m);flex-wrap:wrap;}
  .sf-chip{padding:5px 13px;border-radius:var(--r-pill);border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:var(--fs-meta);font-family:inherit;cursor:pointer;}
  .sf-chip.aktiv{background:var(--gold);border-color:var(--gold);color:#2B2A22;font-weight:600;}

  /* --- Breadcrumb im Player (Punkt 1.1 / 1.7) --- */
  .krumen{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    padding:10px 15px;border-radius:var(--r-pill);min-height:40px;
    color:var(--muted);font-size:var(--fs-body);font-family:inherit;cursor:pointer;}
  .krumen:active{background:var(--surface-tint);color:var(--gruen);}

  /* --- "Weiter"-Button nach Videoende (Punkt 1.8) --- */
  .weiter-naechstes{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-m);
    width:100%;margin-top:var(--sp-l);background:var(--surface-tint);border:1px solid var(--border);
    border-radius:var(--r-l);padding:var(--sp-m) var(--sp-l);cursor:pointer;font-family:inherit;
    color:var(--text);text-align:left;}
  .weiter-naechstes .wn-label{font-size:var(--fs-meta);color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;}
  .weiter-naechstes .wn-titel{font-size:var(--fs-body);font-weight:var(--fw-karte);}

  /* --- Skeleton beim Laden (Punkt 2.6) --- */
  @keyframes skel{0%{opacity:.55;}50%{opacity:1;}100%{opacity:.55;}}
  .skel-karte{height:62px;border-radius:var(--r-l);background:var(--surface-strong);
    margin-bottom:var(--sp-m);animation:skel 1.4s ease-in-out infinite;}

  /* --- Admin-Kennzeichnung (Punkt 1.10) --- */
  .admin-balken{height:3px;background:var(--gold);width:100%;}
  .admin-badge-top{display:inline-flex;align-items:center;gap:5px;background:var(--gold-schwach);
    color:var(--gold);border:1px solid var(--gold-rand);border-radius:var(--r-pill);
    padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

  /* --- Leerer Suchtreffer (Punkt 1.4, freundlich abfangen) --- */
  .leer-hinweis{text-align:center;color:var(--muted);padding:var(--sp-xl) var(--sp-m);
    font-size:var(--fs-body);}

  /* ================= BEREICHS-KACHELN & EIGENE BEREICHSSEITE (24.08.2026) ================= */

  /* --- Große, gestapelte Kacheln auf dem Start-Tab -- helle, ruhige Karten statt
     vollflächiger Farbblöcke. Farbe (Grün/Gold) ist nur noch Akzent: Icon-Kreis,
     Fortschrittsbalken, ein dünner Rand bei 100%. So bleibt es harmonisch, auch wenn
     (fast) alle Bereiche fertig sind, statt zu einer Wand aus einer Farbe zu werden. */
  .bereich-stack{display:flex;flex-direction:column;gap:var(--sp-m);}

    transform:translateY(0); transition:transform .12s ease, box-shadow .12s ease;}
  .bereich-tile:active{transform:translateY(2px); box-shadow:0 0 0 var(--border), 0 2px 6px rgba(43,40,30,.08);}
  .bereich-tile.voll{border-color:var(--gold-rand); box-shadow:0 2px 0 var(--gold-rand), 0 4px 12px rgba(217,149,76,.12);}
  .bt-icon{width:48px;height:48px;border-radius:var(--r-m);background:var(--surface-tint);
    color:var(--gruen);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .bt-titel{font-size:16.5px;font-weight:700;margin-bottom:5px;color:var(--text);}

  .bt-bar-fill{height:100%;background:var(--gruen-hell);border-radius:var(--r-pill);}
  .bereich-tile.voll .bt-bar-fill{background:var(--gold);}
  .bt-meta{font-size:11.5px;color:var(--muted);}
  .bt-arrow{flex-shrink:0;color:var(--faint);}
  .bereich-tile.voll .bt-arrow{color:var(--gold);}

  .bdh-bar-fill{height:100%;background:var(--gruen-hell);border-radius:var(--r-pill);}

  .video-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-m);}
  @media (min-width:520px){ .video-grid{grid-template-columns:1fr 1fr 1fr;} }
  .vg-card{position:relative;border-radius:var(--r-l);overflow:hidden;cursor:pointer;
    aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 4px 12px rgba(20,18,12,.18);transition:transform .12s ease;}
  .vg-card:active{transform:scale(0.96);}
  .vg-card .vg-bg{position:absolute;inset:0;}
  .vg-card .vg-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  .vg-card .vg-code{font-size:9.5px;color:rgba(255,255,255,.7);font-weight:700;letter-spacing:.06em;}
  .vg-card .vg-titel{color:#fff;font-size:12.5px;font-weight:700;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .vg-card .vg-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
    background:var(--gruen);color:#fff;display:flex;align-items:center;justify-content:center;}
  .vg-card .vg-check .ic{width:13px;height:13px;}
  .vg-card .vg-ergebnis{position:absolute;top:8px;left:8px;font-size:15px;}

  /* --- Kleine "Zurück"-Zeile, einheitlich auf allen Unterseiten --- */
  .zurueck-zeile{margin-bottom:var(--sp-m);}

  /* ================= ADMIN: DASHBOARD, ASSISTENT, HISTORIE (25.08.2026) ================= */

  /* --- Kennzahlen-Kacheln --- */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-s);margin-bottom:var(--sp-l);}
  @media (min-width:560px){ .kpi-grid{grid-template-columns:repeat(4,1fr);} }
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
    padding:var(--sp-m);}
  .kpi .kpi-zahl{font-size:24px;font-weight:700;color:var(--gruen);line-height:1.1;}
  .kpi .kpi-label{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25;}
  .kpi.warn{border-color:var(--gold-rand);background:var(--gold-schwach);}
  .kpi.warn .kpi-zahl{color:var(--gold);}

  /* --- Handlungsbedarf-Liste --- */
  .todo-zeile{display:flex;align-items:center;gap:var(--sp-s);padding:10px 0;
    border-bottom:1px solid var(--border);font-size:13.5px;}

  .todo-zeile .td-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .todo-zeile.rot .td-dot{background:#B5573F;}
  .todo-zeile.gelb .td-dot{background:var(--gold);}
  .todo-zeile.gruen .td-dot{background:var(--gruen-hell);}

  /* --- Schritt-Assistent (Video anlegen) --- */
  .schritt-kopf{display:flex;align-items:center;gap:var(--sp-s);margin-bottom:var(--sp-s);}
  .schritt-nr{width:26px;height:26px;border-radius:50%;background:var(--gruen);color:#fff;

  .schritt-titel{font-size:15px;font-weight:700;color:var(--text);}
  .schritt-hilfe{font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:var(--sp-s);

  .themen-gewaehlt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:var(--sp-s);min-height:4px;}

  /* ================= SEITENMENÜ (Drawer), Dashboard, Nützliches ================= */
  /* 27.08.2026: Der Menü-Knopf war mit 18px-Symbol in 30px-Fläche viel zu klein
     zum Treffen. Jetzt 44x44px Tap-Fläche mit 26px-Symbol und kräftigerem Strich,
     damit die drei Striche auch auf dem Tablet klar erkennbar sind. */
  .menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px;
    display:flex;align-items:center;justify-content:center;
    min-width:44px;min-height:44px;border-radius:var(--r-m);}

  .menu-btn .ic{width:26px;height:26px;stroke-width:2.2;vertical-align:0;}

  .drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:var(--surface);

  .drawer-head{padding:var(--sp-l) var(--sp-l) var(--sp-m);border-bottom:1px solid var(--border);}
  .drawer-head .dh-name{font-size:var(--fs-titel);font-weight:var(--fw-titel);color:var(--gruen);}
  .drawer-head .dh-sub{font-size:var(--fs-meta);color:var(--muted);margin-top:2px;}
  .drawer-items{flex:1;overflow-y:auto;padding:var(--sp-s) 0;}
  .drawer-item{display:flex;align-items:center;gap:var(--sp-m);padding:13px var(--sp-l);
    color:var(--text);cursor:pointer;font-size:var(--fs-body);}
  .drawer-item:active{background:var(--surface-tint);}
  .drawer-item .ic{color:var(--gruen-hell);flex-shrink:0;}
  .drawer-item.aktiv{background:var(--surface-tint);color:var(--gruen);font-weight:600;}
  .drawer-item.aktiv .ic{color:var(--gruen);}
  .drawer-foot{padding:var(--sp-m) var(--sp-l);border-top:1px solid var(--border);
    font-size:11px;color:var(--faint);}

  /* --- Dashboard: dichte Liste aller Bereiche --- */
  .dash-row{display:flex;align-items:center;gap:var(--sp-m);padding:11px 0;
    border-bottom:1px solid var(--border);}
  .dash-row:last-child{border-bottom:none;}
  .dash-row .ic{color:var(--gruen-hell);flex-shrink:0;}
  .dash-row .dr-name{flex:1;font-size:var(--fs-body);font-weight:var(--fw-karte);min-width:0;}
  .dash-row .dr-bar{height:6px;border-radius:var(--r-pill);background:var(--border);
    margin-top:5px;overflow:hidden;}
  .dash-row .dr-bar-fill{height:100%;background:var(--gruen-hell);border-radius:var(--r-pill);}
  .dash-row.voll .dr-bar-fill{background:var(--gold);}
  .dash-row .dr-pct{font-size:12.5px;color:var(--muted);width:38px;text-align:right;flex-shrink:0;}

  /* --- Nützliches: PDF-Karten --- */
  .pdf-karte{display:flex;align-items:center;gap:var(--sp-m);padding:var(--sp-m);margin-bottom:var(--sp-s);}
  .pdf-karte .pdf-ic{width:38px;height:38px;border-radius:var(--r-s);background:var(--gold-schwach);
    color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pdf-karte .pdf-titel{font-size:var(--fs-body);font-weight:var(--fw-karte);}
  .pdf-karte .pdf-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pdf-karte a{margin-left:auto;color:var(--gruen);flex-shrink:0;}
  .info-block{padding:var(--sp-m);margin-bottom:var(--sp-s);}
  .info-block p{margin:0 0 var(--sp-s);font-size:var(--fs-body);line-height:1.5;}
  .info-block p:last-child{margin-bottom:0;}
</style>

// Bereiche. Bereich für Bereich umgebaut, alte Stufen/Tags bleiben in der DB bestehen (Kompass
// verlinkt darauf) -- diese Tabelle fängt alte Tag-IDs unsichtbar ab und leitet sie auf die neue
// Struktur um, sobald ein Bereich fertig umgezogen ist. Wird mit jedem weiteren Bereich ergänzt.
const LEGACY_TAG_REDIRECT = {
  "t11_parken": "b4_laengsparken",
  "t12_technikwissen": "b12_checkliste"
};

const LEGACY_STUFE_REDIRECT = {
  "technik": "Fahrzeug-Check",

};
function parseDeepLinkStufe(){
  const params = new URLSearchParams(location.search);
  let raw = (params.get("stufe") || "").trim().toLowerCase();
  if(!raw) return null;
  if(LEGACY_STUFE_REDIRECT[raw]) return LEGACY_STUFE_REDIRECT[raw];
  return STUFEN_ORDER.find(function(s){ return s.toLowerCase() === raw; }) || null;
}

function parseDeepLinkTag(){
  const params = new URLSearchParams(location.search);
  let raw = (params.get("tag") || "").trim();
  if(!raw) return null;
  // Falls dieser Tag im Zuge der Umstrukturierung "leergezogen" wurde, unsichtbar
  // auf die neue Kategorie umleiten -- Kompass-Links bleiben dadurch funktionsfähig.
  if(LEGACY_TAG_REDIRECT[raw]) raw = LEGACY_TAG_REDIRECT[raw];
  return allTags.find(function(t){ return t.id === raw; }) || null;
}

// Baut den Lernpfad: pro Stufe alle Videos in Ausbildungsplan-Reihenfolge,
// mit eindeutigem Code (z. B. "G-1", "A-3") — das ersetzt das Suchen durch Blättern.
// Bereich 7.9 (27.08.2026): Ist dieses Thema für den eingeloggten Schüler frei?
// Themen ohne nur_klasse sind immer frei. Themen MIT nur_klasse brauchen zusätzlich
// eine aktive Freigabe (academy_klassen_freigabe) -- Standard ist gesperrt.
// Gesperrte Themen werden NICHT versteckt, sondern sichtbar mit Hinweis gezeigt,
// damit der Schüler weiß, dass es sie gibt und er sie freischalten lassen kann.
function tagGesperrt(tag){
  if(!tag || !tag.nur_klasse) return false;
  const freigabe = (session && session.klassen_freigabe) ? session.klassen_freigabe : {};
  return freigabe[tag.nur_klasse] !== true;
}

function buildLernpfad(){
  const tagsSorted = allTags.slice().sort(function(a,b){ return (a.reihenfolge||0) - (b.reihenfolge||0); });
  const result = [];
  STUFEN_ORDER.forEach(function(stufe){
    const tagsInStufe = tagsSorted.filter(function(t){ return t.stufe === stufe; });
    if(tagsInStufe.length === 0) return;
    let counter = 0;
    const videos = [];
    // Ein Video kann mehrere Themen desselben Bereichs haben (z.B. "Stoppschilder"
    // UND "Zebrastreifen"). Ohne diese Sperre erschiene es mehrfach untereinander --
    // deshalb pro Bereich nur beim ERSTEN passenden Thema aufnehmen.
    const bereitsAufgenommen = new Set();
    tagsInStufe.forEach(function(tag){
      const vids = videoTags.filter(function(vt){ return vt.tag_id === tag.id; })
        .map(function(vt){ return allVideos.find(function(v){ return v.id === vt.video_id; }); })
        .filter(Boolean);
      vids.forEach(function(v){
        if(bereitsAufgenommen.has(v.id)) return;
        bereitsAufgenommen.add(v.id);
        counter++;
        videos.push({ video:v, tag:tag, code: STUFE_PREFIX[stufe] + "-" + counter, gesperrt: tagGesperrt(tag) });
      });
    });
    if(videos.length > 0) result.push({ stufe:stufe, videos:videos });
  });
  return result;
}

function esc(s){
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function init(){
  if(location.hash === "#admin"){
    if(adminSession){ ensureRoleThenShowAdminApp(); } else { showAdminLogin(); }
    return;
  }
  if(DEMO_MODE && !session){
    session = { demo:true, name:"Testfahrer" };
  }
  if(session){
    showApp();
  } else {
    showLogin();
  }
}

async function doLogin(){
  const tel = document.getElementById("lo-tel").value.trim();
  const pin = document.getElementById("lo-pin").value.trim();
  const errEl = document.getElementById("lo-err");
  errEl.textContent = "";
  if(!tel || !pin){ errEl.textContent = "Bitte Telefonnummer und PIN eingeben"; return; }

  if(DEMO_MODE){
    session = { demo:true, name:"Testfahrer" };
    localStorage.setItem("academy_session", JSON.stringify(session));
    showApp();
    return;
  }

  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ telefon: tel, pin: pin })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || "Login fehlgeschlagen"; return; }
    session = data;
    localStorage.setItem("academy_session", JSON.stringify(session));
    showApp();
  } catch(e){
    errEl.textContent = "Verbindungsfehler — bitte Internet prüfen";
  }
}

function doLogout(){
  localStorage.removeItem("academy_session");
  session = null;
  openStufen = new Set();
  showLogin();
}

/* ---- Push-Benachrichtigungen (20.08.2026) ----
   Bei "granted" wird im Hintergrund still (re-)abonniert, ohne den Schüler zu stören.
   Bei "default" (noch nie gefragt) zeigt showApp() ein dezentes Banner statt eines
   Sofort-Popups -- iOS/Android blocken aufdringliche Permission-Prompts gerne eh. */
async function subscribeToPush(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  if(!session || session.demo) return false;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    const raw = sub.toJSON();
    await fetch(SUPABASE_URL + "/functions/v1/academy-save-push-subscription", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        session_token: session.session_token,
        endpoint: raw.endpoint,
        p256dh: raw.keys.p256dh,
        auth_key: raw.keys.auth
      })
    });
    return true;
  } catch(e){ return false; }
}

async function enablePushClicked(){
  const ok = await subscribeToPush();
  const banner = document.getElementById("pushBanner");
  if(banner) banner.remove();
  if(ok) showToast("Benachrichtigungen aktiviert ✓");
  else showToast("Berechtigung nicht erteilt");
}
function dismissPushBanner(){
  localStorage.setItem("academy_push_dismissed", "1");
  const banner = document.getElementById("pushBanner");
  if(banner) banner.remove();
}
async function maybeShowPushBanner(){
  if(!("Notification" in window) || DEMO_MODE || !session || session.demo) return;
  if(Notification.permission === "granted"){ subscribeToPush(); return; }
  if(Notification.permission === "denied") return;
  if(localStorage.getItem("academy_push_dismissed") === "1") return;
  const el = document.getElementById("app");
  if(!el || document.getElementById("pushBanner")) return;
  const banner = document.createElement("div");
  banner.id = "pushBanner";
  banner.style.cssText = "position:sticky;top:0;z-index:50;background:var(--gold,#D9954C);color:#2B2A22;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;";
  banner.innerHTML = '<span>🔔 Benachrichtigt werden, wenn neue Videos freigeschaltet werden?</span>' +
    '<span style="display:flex;gap:8px;white-space:nowrap;">' +
    '<button id="pushBannerYes" style="background:#2F4A34;color:#fff;border:none;border-radius:8px;padding:6px 12px;">Aktivieren</button>' +
    '<button id="pushBannerNo" style="background:transparent;color:#2B2A22;border:none;">Später</button></span>';
  el.prepend(banner);
  document.getElementById("pushBannerYes").addEventListener("click", enablePushClicked);
  document.getElementById("pushBannerNo").addEventListener("click", dismissPushBanner);
}

async function showApp(){
  document.getElementById("app").innerHTML = '<div class="skel-karte"></div><div class="skel-karte"></div><div class="skel-karte"></div>';

  // Echte Zustimmungs-Sperre (25.08.2026): Ohne agb_akzeptiert_am kommt niemand am
  // Zustimmungsbildschirm vorbei -- kein Zurück-Button, keine Bottom-Nav, kein Umgehen.
  if(session && !session.demo && !session.agb_akzeptiert_am){
    renderZustimmung();
    return;
  }

  try{
    await loadCatalog();
    await loadVerlauf();
    const deepLinkTag = parseDeepLinkTag();
    const deepLinkStufe = parseDeepLinkStufe();
    if(deepLinkTag){
      // Kompass-Link mit Tag: direkt auf die Bereichsseite, das passende Video markiert
      mainView = "bereichdetail";
      selectedBereich = deepLinkTag.stufe;
      deepLinkTagId = deepLinkTag.id;
    } else if(deepLinkStufe){
      // Kompass-Link nur mit Stufe: Bereichsseite ohne Einzel-Markierung
      mainView = "bereichdetail";
      selectedBereich = deepLinkStufe;
    }
    renderCatalog();
    maybeShowPushBanner();
    if(deepLinkTagId){
      setTimeout(function(){
        const el = document.getElementById("dl-target");
        if(el) el.scrollIntoView({ behavior:"smooth", block:"center" });
        deepLinkTagId = null; // nur beim ersten Öffnen scrollen/markieren, nicht bei jedem Re-Render
      }, 150);
    }
  } catch(e){
    document.getElementById("app").innerHTML = '<div class="err">Katalog konnte nicht geladen werden</div>';
  }
}

async function loadVerlauf(){
  if(DEMO_MODE){
    // Im Demo-Modus gibt's keinen echten Verlaufs-Server — seenVideoIds (lokal) reicht als Näherung
    verlaufData = Array.from(seenVideoIds).map(function(vid){
      return { video_id: vid, gesehen_am: new Date().toISOString() };
    });
    return;
  }
  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-progress", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ session_token: session.session_token })
    });
    const data = await res.json();
    if(res.ok && data.verlauf){
      verlaufData = data.verlauf;
      seenVideoIds = new Set(verlaufData.map(function(v){ return v.video_id; }));
    }
  } catch(e){
    // Verlauf ist ein Komfort-Feature — bei Netzwerkfehler App trotzdem nutzbar lassen
    verlaufData = [];
  }
}

async function loadCatalog(){
  if(DEMO_MODE){
    allTags = DEMO_TAGS;
    allVideos = DEMO_VIDEOS;
    videoTags = DEMO_VIDEO_TAGS;
    allPruefer = DEMO_PRUEFER;
    videoPruefer = [];
    return;
  }
  const tagsRes = await supa.from("academy_tags").select("*").order("reihenfolge");
  const videosRes = await supa.from("academy_videos").select("*").order("reihenfolge");
  const vtagsRes = await supa.from("academy_video_tags").select("*");
  const prRes = await supa.from("academy_pruefer").select("*");
  const vprRes = await supa.from("academy_video_pruefer").select("*");
  allTags = tagsRes.data || [];
  // Schüler sehen nur Videos, die tatsächlich mit Bunny verknüpft sind — sonst
  // klickt jemand auf ein "leeres" Video, das noch gar nicht abspielbar ist.
  allVideos = (videosRes.data || []).filter(function(v){ return !!v.bunny_video_id; });
  videoTags = vtagsRes.data || [];
  allPruefer = prRes.data || [];
  videoPruefer = vprRes.data || [];
}

function buildPruefungsstrecken(){
  // Gruppiert Videos nach Prüfer. Ein Video kann bei mehreren Prüfern auftauchen
  // (geteilte Strecken) — genau wie ein Video mehrere Themen-Tags haben kann.
  const result = [];
  allPruefer.forEach(function(pr){
    const vids = videoPruefer.filter(function(vp){ return vp.pruefer_id === pr.id; })
      .map(function(vp){ return allVideos.find(function(v){ return v.id === vp.video_id; }); })
      .filter(Boolean);
    if(vids.length > 0) result.push({ pruefer: pr, videos: vids });
  });
  return result;
}

function renderLernpfadHtml(){
  const pfad = buildLernpfad();

  const suchLeiste =
    '<div class="suchzeile">' + icon("suche") +
      '<input id="such-input" type="search" placeholder="Suchen, z. B. Kreisverkehr" value="' + esc(suchBegriff) + '">' +
      '<button class="such-clear' + (suchBegriff ? " sichtbar" : "") + '" id="such-clear" aria-label="Suche löschen">' + icon("x","ic-s") + '</button>' +
    "</div>";

  const statusChips =
    '<div class="status-filter">' +
      [["alle","Alle"],["offen","Offen"],["fertig","Fertig"]].map(function(p){
        return '<button class="sf-chip' + (statusFilter === p[0] ? " aktiv" : "") + '" data-statusfilter="' + p[0] + '">' + p[1] + "</button>";
      }).join("") +
    "</div>";

  const sucheAktiv = !!suchBegriff || statusFilter !== "alle";

  if(!sucheAktiv){
    // Kein Suchbegriff aktiv: gleiche Bereichs-Kacheln wie auf dem Start-Tab -- EIN
    // einheitliches Prinzip, um "in einen Bereich zu gehen", statt zweier verschiedener.
    const kacheln = pfad.map(function(g){
      const gesamt = g.videos.length;
      const gesehen = g.videos.filter(function(x){ return seenVideoIds.has(x.video.id); }).length;
      const pct = gesamt ? Math.round(gesehen/gesamt*100) : 0;
      return '<button class="bereich-tile' + (pct>=100?" voll":"") + '" data-gotostufe="' + esc(g.stufe) + '">' +
        '<div class="bt-icon">' + bereichIcon(g.stufe) + "</div>" +
        '<div class="bt-body"><div class="bt-titel">' + esc(g.stufe) + "</div>" +
          '<div class="bt-bar"><div class="bt-bar-fill" style="width:' + pct + '%;"></div></div>' +
          '<div class="bt-meta">' + gesehen + " von " + gesamt + " Videos · " + pct + "%</div></div>" +
        '<span class="bt-arrow">' + icon("weiter") + "</span>" +
      "</button>";
    }).join("");
    return suchLeiste + statusChips + '<div class="bereich-stack">' + kacheln + "</div>";
  }

  // Suche/Statusfilter aktiv: flaches Ergebnis-Raster über alle Bereiche hinweg,
  // jede Karte öffnet direkt das Video (Zurück führt danach in dessen Bereichsseite).
  // Ein Video kann Themen in MEHREREN Bereichen haben -- daher hier zusätzlich
  // entdoppeln, sonst erschiene es im Suchergebnis mehrfach.
  let treffer = [];
  const gesehenIds = new Set();
  pfad.forEach(function(g){
    const passend = g.videos.filter(function(x){ return passtZurSuche(x.video, x.tag); });
    const gefiltert = passend.filter(function(x){
      if(gesehenIds.has(x.video.id)) return false;
      if(statusFilter !== "alle"){
        const gesehen = seenVideoIds.has(x.video.id);
        if(statusFilter === "fertig" ? !gesehen : gesehen) return false;
      }
      gesehenIds.add(x.video.id);
      return true;
    });
    treffer = treffer.concat(gefiltert);
  });

  const karten = treffer.map(function(x){
    const check = seenVideoIds.has(x.video.id) ? '<span class="vg-check">' + icon("check","ic-s") + "</span>" : "";
    const ergebnisIcon = x.video.pruefung_ergebnis === "bestanden" ? '<span class="vg-ergebnis">✅</span>'
      : x.video.pruefung_ergebnis === "nicht_bestanden" ? '<span class="vg-ergebnis">❌</span>' : "";
    return '<div class="vg-card" data-vid="' + esc(x.video.id) + '">' +
      '<div class="vg-bg" style="background:' + vgGradientFuer(x.video.id) + ';"></div>' + vgBildLayer(x.video) +
      '<div class="vg-play">' + icon("play") + "</div>" +
      ergebnisIcon + check +
      '<div class="vg-info"><div class="vg-code">' + esc(x.tag.label) + '</div><div class="vg-titel">' + esc(x.video.titel) + "</div></div>" +
    "</div>";
  }).join("");

  return suchLeiste + statusChips + '<div class="video-grid">' + (karten || '<div class="leer-hinweis">' +
    (suchBegriff ? 'Nichts gefunden für „' + esc(suchBegriff) + '".' : "Nichts in diesem Filter.") + "</div>") + "</div>";
}

function renderPruefungsstreckenHtml(){
  const gruppen = buildPruefungsstrecken();
  return gruppen.map(function(g){
    const isOpen = openPruefer.has(g.pruefer.id);
    const videoRows = g.videos.map(function(v){
      const tagsForVideo = videoTags.filter(function(vt){ return vt.video_id === v.id; })
        .map(function(vt){ const t = allTags.find(function(x){ return x.id === vt.tag_id; }); return t ? t.label : null; })
        .filter(Boolean).join(", ");
      const check = seenVideoIds.has(v.id) ? '<span class="video-check">✓</span>' : "";
      return '<div class="video-card glass" data-vid="' + esc(v.id) + '">' +
        '<div><div class="video-title">' + esc(v.titel) + "</div>" +
          (tagsForVideo ? '<div class="video-desc" style="opacity:.7;">Enthält: ' + esc(tagsForVideo) + "</div>" : "") +
        "</div>" + check +
      "</div>";
    }).join("");

    return '<div class="stufe-section">' +
      '<div class="stufe-header' + (isOpen ? " open" : "") + '" data-pruefer="' + esc(g.pruefer.id) + '">' +
        '<div class="stufe-header-left">' +
          '<span class="stufe-caret">' + (isOpen ? "▾" : "▸") + "</span>" +
          '<span class="stufe-name">' + esc(g.pruefer.name) + "</span>" +
        "</div>" +
        '<span class="admin-badge badge-gesperrt">' + g.videos.length + " Video" + (g.videos.length === 1 ? "" : "s") + "</span>" +
      "</div>" +
      (isOpen ? '<div class="video-list">' + videoRows + "</div>" : "") +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Prüfungsstrecken hinterlegt.</div>';
}

function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}) + " · " +
    d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
}

function renderStartHtml(){
  const totalVideos = allVideos.length;
  const seenCount = allVideos.filter(function(v){ return seenVideoIds.has(v.id); }).length;
  const name = (session && session.name) ? session.name : "";
  const prozent = totalVideos ? Math.round(seenCount / totalVideos * 100) : 0;

  // Bereich 1.2: EINE prominente Fortsetzen-Karte -- zuletzt Angesehenes hat Vorrang,
  // sonst das nächste offene Video. Bewusst nur eine Karte, damit der Start ruhig bleibt.
  const pfad = buildLernpfad();
  const naechste = (function(){
    for(const gruppe of pfad){
      const offen = gruppe.videos.find(function(x){ return !seenVideoIds.has(x.video.id); });
      if(offen) return { gruppe: gruppe.stufe, x: offen };
    }
    return null;
  })();

  let fortsetzen = null;
  if(verlaufData.length > 0){
    const letztesVideo = allVideos.find(function(v){ return v.id === verlaufData[0].video_id; });
    if(letztesVideo) fortsetzen = { id: letztesVideo.id, titel: letztesVideo.titel, label: t("weiterSchauen") };
  }
  if(!fortsetzen && naechste){
    fortsetzen = { id: naechste.x.video.id, titel: naechste.x.video.titel, label: t("alsNaechstes") + ": " + naechste.gruppe };
  }

  const weiterKarte = fortsetzen
    ? '<div class="weiter-karte" data-vid="' + esc(fortsetzen.id) + '">' +
        '<div class="wk-play">' + icon("play") + "</div>" +
        "<div><div class=\"wk-label\">" + esc(fortsetzen.label) + "</div>" +
        '<div class="wk-titel">' + esc(fortsetzen.titel) + "</div></div>" +
      "</div>"
    : '<div class="karte" style="margin-bottom:var(--sp-l);text-align:center;">' +
        '<div style="font-size:var(--fs-karte);font-weight:var(--fw-karte);">' + esc(t("allesGesehen")) + "</div>" +
        '<div class="admin-sub">Schau gern nochmal bei den Prüfungsstrecken vorbei.</div>' +
      "</div>";

  // Große, gestapelte 3D-Kacheln statt der wegscrollenden Kreise -- jede Kachel öffnet
  // die eigene "Netflix-artige" Bereichsseite (renderBereichDetailHtml).
  const kacheln = pfad.map(function(g){
    const gesamt = g.videos.length;
    const gesehen = g.videos.filter(function(x){ return seenVideoIds.has(x.video.id); }).length;
    const pct = gesamt ? Math.round(gesehen/gesamt*100) : 0;
    return '<button class="bereich-tile' + (pct>=100?" voll":"") + '" data-gotostufe="' + esc(g.stufe) + '">' +
      '<div class="bt-icon">' + bereichIcon(g.stufe) + "</div>" +
      '<div class="bt-body">' +
        '<div class="bt-titel">' + esc(g.stufe) + "</div>" +
        '<div class="bt-bar"><div class="bt-bar-fill" style="width:' + pct + '%;"></div></div>' +
        '<div class="bt-meta">' + gesehen + " von " + gesamt + " Videos · " + pct + "%</div>" +
      "</div>" +
      '<span class="bt-arrow">' + icon("weiter") + "</span>" +
    "</button>";
  }).join("");

  // --- Bereich 7.1/7.2 (27.08.2026): Empfehlung aus dem Fahrlehrer-Kompass ---
  // Kommt beim Login mit (session.empfehlung). Zeigt das konkrete Video zum
  // gemeldeten Ausbildungsstand -- oder, falls kein Video zum Thema existiert,
  // wenigstens den Sprung in den passenden Bereich.
  let empfKarte = "";
  const empf = session && session.empfehlung;
  if(empf && (empf.tag_id || empf.stufe)){
    let treffer = null;
    if(empf.tag_id){
      for(const g of pfad){
        const f = g.videos.find(function(x){ return x.tag.id === empf.tag_id && !x.gesperrt; });
        if(f){ treffer = { gruppe:g.stufe, x:f }; break; }
      }
    }
    if(treffer){
      empfKarte =
        '<div class="karte empf-card" data-vid="' + esc(treffer.x.video.id) + '" style="cursor:pointer;margin-bottom:var(--sp-l);">' +
          '<div class="empf-badge">' + esc(t("empfohlen")) + "</div>" +
          '<div style="font-size:var(--fs-karte);font-weight:var(--fw-karte);">' + esc(treffer.x.video.titel) + "</div>" +
          '<div class="admin-sub">' + esc(empf.nachricht || treffer.gruppe) + "</div>" +
        "</div>";
    } else if(empf.stufe && pfad.some(function(g){ return g.stufe === empf.stufe; })){
      // Kein passendes Video: nur anzeigen, wenn der Bereich wirklich existiert,
      // sonst bliebe ein toter Hinweis stehen.
      empfKarte =
        '<div class="karte empf-card" data-gotostufe="' + esc(empf.stufe) + '" style="cursor:pointer;margin-bottom:var(--sp-l);">' +
          '<div class="empf-badge">' + esc(t("empfohlen")) + "</div>" +
          '<div style="font-size:var(--fs-karte);font-weight:var(--fw-karte);">' + esc(empf.stufe) + "</div>" +
          '<div class="admin-sub">' + esc(empf.nachricht || "Dein nächstes Thema — tippen zum Öffnen") + "</div>" +
        "</div>";
    }
  }

  // --- Bereich 7.6: Prüfungstermin-Countdown, sobald Kompass einen Termin gemeldet hat ---
  let terminKarte = "";
  if(session && session.pruefungstermin){
    const termin = new Date(session.pruefungstermin + "T00:00:00");
    const heute = new Date(); heute.setHours(0,0,0,0);
    const tage = Math.round((termin - heute) / 86400000);
    if(!isNaN(tage) && tage >= 0 && tage <= 60){
      const wann = tage === 0 ? "heute" : (tage === 1 ? "morgen" : "in " + tage + " Tagen");
      terminKarte =
        '<div class="karte" style="margin-top:var(--sp-l);">' +
          '<div class="section-label" style="margin:0 0 6px;">' + esc(t("deinePruefung")) + "</div>" +
          '<div style="font-size:var(--fs-karte);font-weight:var(--fw-karte);">' + esc(wann) + "</div>" +
          '<div class="admin-sub">' + esc(termin.toLocaleDateString("de-DE")) + "</div>" +
        "</div>";
    }
  }

  return (
    '<div class="tagline" style="font-size:22px;margin-bottom:var(--sp-m);">' + esc(t("willkommen")) + (name ? ", " + esc(name) : "") + "</div>" +
    empfKarte +
    weiterKarte +
    '<div class="section-label" style="margin-top:0;">' + esc(t("deineBereiche")) + "</div>" +
    '<div class="bereich-stack">' + kacheln + "</div>" +
    terminKarte
  );
}

function renderVerlaufHtml(){
  if(verlaufData.length === 0){
    return '<div class="empty">Noch nichts angesehen — starte im Lernpfad!</div>';
  }
  // Pro Video aggregieren: wie oft gesehen, wann zuletzt
  const proVideo = {};
  verlaufData.forEach(function(e){
    if(!proVideo[e.video_id]) proVideo[e.video_id] = { count:0, letztes:e.gesehen_am };
    proVideo[e.video_id].count++;
    if(e.gesehen_am > proVideo[e.video_id].letztes) proVideo[e.video_id].letztes = e.gesehen_am;
  });
  const sortiert = Object.keys(proVideo).sort(function(a,b){
    return proVideo[b].letztes.localeCompare(proVideo[a].letztes);
  });

  const rows = sortiert.map(function(vid){
    const v = allVideos.find(function(x){ return x.id === vid; });
    if(!v) return "";
    const info = proVideo[vid];
    return '<div class="video-card glass" data-vid="' + esc(vid) + '">' +
      '<div><div class="video-title">' + esc(v.titel) + "</div>" +
        '<div class="video-desc">Zuletzt: ' + fmtDateTime(info.letztes) + "</div>" +
      "</div>" +
      '<span class="admin-badge badge-aktiv" style="margin-left:auto;">' + info.count + "× gesehen</span>" +
    "</div>";
  }).join("");

  return '<div class="video-list">' + rows + "</div>";
}

// Bereichsübergreifende Suche: ein Video kann mehrere Themen gleichzeitig haben
// (z.B. ein Video zeigt "Stoppschilder" UND "Engstellen"). Antippt man ein #,
// sieht man ALLE Videos mit diesem Thema, egal aus welchem Bereich sie stammen.
function renderThemenHtml(){
  if(!selectedHashtag){
    // Übersicht: alle Themen als # -- wie oft genutzt, damit man sieht was sich lohnt
    const nutzung = {};
    videoTags.forEach(function(vt){ nutzung[vt.tag_id] = (nutzung[vt.tag_id]||0) + 1; });
    const genutzteTags = allTags.filter(function(t){ return nutzung[t.id] > 0; })
      .sort(function(a,b){ return nutzung[b.id] - nutzung[a.id]; });
    const chips = genutzteTags.map(function(t){
      return '<button class="sf-chip" data-hashtag="' + esc(t.id) + '" style="margin:3px;">#' + esc(t.label) + ' · ' + nutzung[t.id] + "</button>";
    }).join("");
    return '<button class="krumen zurueck-zeile" data-zurueckstart>' + icon("zurueck") + "<span>Start</span></button>" +
      '<div class="tagline" style="font-size:20px;margin-bottom:4px;"># Themen</div>' +
      '<div class="admin-sub" style="margin-bottom:14px;">Ein Video kann mehrere Themen haben — tippe eins an, um alle passenden Videos zu sehen.</div>' +
      '<div style="display:flex;flex-wrap:wrap;">' + (chips || '<div class="leer-hinweis">Noch keine Themen vergeben.</div>') + "</div>";
  }

  const tag = allTags.find(function(t){ return t.id === selectedHashtag; });
  const treffer = videoTags.filter(function(vt){ return vt.tag_id === selectedHashtag; })
    .map(function(vt){ return allVideos.find(function(v){ return v.id === vt.video_id; }); })
    .filter(Boolean);

  const karten = treffer.map(function(v){
    const check = seenVideoIds.has(v.id) ? '<span class="vg-check">' + icon("check","ic-s") + "</span>" : "";
    return '<div class="vg-card" data-vid="' + esc(v.id) + '">' +
      '<div class="vg-bg" style="background:' + vgGradientFuer(v.id) + ';"></div>' + vgBildLayer(v) +
      '<div class="vg-play">' + icon("play") + "</div>" + check +
      '<div class="vg-info"><div class="vg-titel">' + esc(v.titel) + "</div></div>" +
    "</div>";
  }).join("");

  return '<button class="krumen zurueck-zeile" data-hashtag-zurueck>' + icon("zurueck") + "<span># Themen</span></button>" +
    '<div class="tagline" style="font-size:19px;margin-bottom:14px;">#' + esc(tag ? tag.label : "") + "</div>" +
    '<div class="video-grid">' + (karten || '<div class="leer-hinweis">Keine Videos gefunden.</div>') + "</div>";
}

/* 27.08.2026: Seit dem Papierbogen-Layout scrollt auf breiten Bildschirmen
   nicht mehr die Seite, sondern #app selbst. window.scrollTo hat dort keine
   Wirkung mehr. Diese Helferfunktion trifft immer das richtige Element --
   am Handy die Seite, am Tablet den Bogen. */
function nachObenScrollen(){
  const bogen = document.getElementById("app");
  if(bogen && bogen.scrollHeight > bogen.clientHeight + 1){
    bogen.scrollTo({ top:0, behavior:"smooth" });
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}

function markSeen(videoId){
  seenVideoIds.add(videoId);
  localStorage.setItem("academy_demo_seen", JSON.stringify(Array.from(seenVideoIds)));
}

// Bereich 1.1: In welchem Bereich liegt dieses Video? (für den Breadcrumb)
function findeVideoKontext(videoId){
  const pfad = buildLernpfad();
  for(const g of pfad){
    const treffer = g.videos.find(function(x){ return x.video.id === videoId; });
    if(treffer) return { stufe: g.stufe, tag: treffer.tag, code: treffer.code };
  }
  return null;
}
// Bereich 1.8: Nächstes ungesehenes Video -- erst im selben Bereich, dann bereichsübergreifend.
function findeNaechstesOffenes(aktuellId){
  const pfad = buildLernpfad();
  const kontext = findeVideoKontext(aktuellId);
  if(kontext){
    const gruppe = pfad.find(function(g){ return g.stufe === kontext.stufe; });
    if(gruppe){
      const idx = gruppe.videos.findIndex(function(x){ return x.video.id === aktuellId; });
      for(let i = idx + 1; i < gruppe.videos.length; i++){
        if(!seenVideoIds.has(gruppe.videos[i].video.id)) return gruppe.videos[i];
      }
    }
  }
  for(const g of pfad){
    const offen = g.videos.find(function(x){ return x.video.id !== aktuellId && !seenVideoIds.has(x.video.id); });
    if(offen) return offen;
  }
  return null;
}

// Echte Video-Vorschaubilder von Bunny Stream (26.08.2026).
// Hostname steht im Bunny-Dashboard unter Stream > deine Library > API.
// Leer lassen = alle Kacheln nutzen weiterhin die Farbverläufe unten.
// Lädt ein Bild nicht (z.B. wegen Token-Schutz), fällt die Kachel automatisch
// auf den Farbverlauf zurück -- es kann also nichts "kaputt" aussehen.
const BUNNY_PULL_ZONE = "vz-d3992a0e-19f.b-cdn.net";
function vgThumbnail(video){
  if(!BUNNY_PULL_ZONE || !video.bunny_video_id) return "";
  return "https://" + BUNNY_PULL_ZONE + "/" + video.bunny_video_id + "/thumbnail.jpg";
}
// Erzeugt den Bild-Layer einer Kachel (leer, wenn kein Thumbnail verfügbar).
function vgBildLayer(video){
  const url = vgThumbnail(video);
  if(!url) return "";
  return '<img class="vg-thumb" src="' + esc(url) + '" alt="" loading="lazy" ' +
    'onerror="this.style.display=\'none\';">';
}

// Kein Zugriff auf echte Bunny-Thumbnails (CDN-Adresse nicht bekannt) -- stattdessen
// hochwertige Farbverlauf-"Kinoplakate", stabil pro Video (gleiche Farbe bei jedem Aufruf).
const VG_GRADIENTS = [
  "linear-gradient(160deg,#2F4A34,#4B7A56)",
  "linear-gradient(160deg,#8A5A2A,#D9954C)",
  "linear-gradient(160deg,#2F4A34,#1A2A1E)",
  "linear-gradient(160deg,#6B4423,#B87830)",
  "linear-gradient(160deg,#3A5A42,#2F4A34)",
];
function vgGradientFuer(videoId){
  let h = 0;
  for(let i=0;i<videoId.length;i++) h = (h*31 + videoId.charCodeAt(i)) >>> 0;
  return VG_GRADIENTS[h % VG_GRADIENTS.length];
}

async function openVideo(videoId){
  if(DEMO_MODE){
    markSeen(videoId);
    const v = allVideos.find(function(x){ return x.id === videoId; });
    document.getElementById("app").innerHTML =
      '<button id="back-btn" class="back">← Zurück</button>' +
      '<div class="player-wrap"><div class="demo-player">' +
        '<div class="big-ic">▶</div>' +
        '<div style="font-weight:700;color:var(--text);font-size:16px;">' + esc(v ? v.titel : "") + "</div>" +
        '<div>Demo-Modus — hier würde das echte Video laufen, sobald Bunny Stream verbunden ist.</div>' +
      "</div></div>";
    document.getElementById("back-btn").addEventListener("click", renderCatalog);
    return;
  }

  document.getElementById("app").innerHTML = '<div class="loading">Video wird geladen …</div>';
  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-video-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ session_token: session.session_token, video_id: videoId })
    });
    const data = await res.json();

    if(!res.ok){
      if(res.status === 401 || res.status === 403){
        localStorage.removeItem("academy_session");
        session = null;
        showLogin();
        return;
      }
      document.getElementById("app").innerHTML =
        '<div class="err">' + esc(data.error || "Fehler beim Laden") + '</div><button id="back-btn" class="back">Zurück</button>';
      document.getElementById("back-btn").addEventListener("click", renderCatalog);
      return;
    }

    // Bereich 10.4 (27.08.2026): Untertitel im Player aktivieren.
    // captions=de zeigt die deutsche Untertitelspur automatisch an, wenn zu diesem
    // Video eine hinterlegt ist. Fehlt die Spur, ignoriert Bunny den Parameter --
    // es geht also nichts kaputt bei Videos ohne Untertitel.
    // WICHTIG: Die Untertiteldateien selbst müssen in Bunny Stream je Video
    // hochgeladen werden (Video > Captions). Das kann ich nicht für dich tun.
    const embedUrl = "https://iframe.mediadelivery.net/embed/" + data.library_id + "/" + data.bunny_video_id +
      "?token=" + data.token + "&expires=" + data.expires + "&captions=" + encodeURIComponent(sprache);

    // Server hat den Fortschritt schon gespeichert — lokal sofort mitziehen,
    // damit Häkchen/Verlauf auch ohne Neu-Login sofort aktuell sind.
    seenVideoIds.add(videoId);
    verlaufData.unshift({ video_id: videoId, gesehen_am: new Date().toISOString() });

    // Bereich 1.1/1.7: Breadcrumb zeigt, WOHIN man zurückspringt.
    // Bereich 1.8: "Weiter" schlägt das nächste offene Video vor -- erst in derselben
    // Kategorie, danach im nächsten offenen Bereich, damit die Kette nie ins Leere läuft.
    const kontext = findeVideoKontext(videoId);
    const naechstes = findeNaechstesOffenes(videoId);
    const krume = '<button id="back-btn" class="krumen">' + icon("zurueck") +
      "<span>" + esc(kontext ? kontext.stufe : "Übersicht") + "</span></button>";
    const weiterBtn = naechstes
      ? '<button class="weiter-naechstes" data-weiter="' + esc(naechstes.video.id) + '">' +
          '<span><span class="wn-label">Weiter</span><br><span class="wn-titel">' + esc(naechstes.video.titel) + "</span></span>" +
          icon("weiter") +
        "</button>"
      : "";

    document.getElementById("app").innerHTML =
      krume +
      '<div class="player-wrap"><iframe src="' + embedUrl + '" loading="lazy" ' +
      'style="border:0;width:100%;aspect-ratio:16/9;display:block;" allow="autoplay; fullscreen"></iframe></div>' +
      weiterBtn;
    document.getElementById("back-btn").addEventListener("click", function(){
      // Konsistent: von JEDEM Video führt "Zurück" in dessen eigene Bereichsseite --
      // unabhängig davon, ob man vom Start, vom Lernpfad oder per Suche hierhergekommen ist.
      if(kontext){ selectedBereich = kontext.stufe; mainView = "bereichdetail"; }
      renderCatalog();
    });
    const wb = document.querySelector("[data-weiter]");
    if(wb) wb.addEventListener("click", function(){ openVideo(wb.dataset.weiter); });
  } catch(e){
    document.getElementById("app").innerHTML = '<div class="err">Verbindungsfehler</div>';
  }
}

async function doAdminLogin(){
  const email = document.getElementById("ao-email").value.trim();
  const pass = document.getElementById("ao-pass").value.trim();
  const errEl = document.getElementById("ao-err");
  errEl.textContent = "";
  if(!email || !pass){ errEl.textContent = "Bitte E-Mail und Passwort eingeben"; return; }

  if(DEMO_MODE){
    adminSession = { demo:true, email:email };
    myRole = "super_admin";
    mySchule = null;
    localStorage.setItem("academy_admin_session", JSON.stringify(adminSession));
    showAdminApp();
    return;
  }
  try{
    const { data, error } = await supa.auth.signInWithPassword({ email:email, password:pass });
    if(error){ errEl.textContent = "Login fehlgeschlagen: " + error.message; return; }
    adminSession = { email:email };
    localStorage.setItem("academy_admin_session", JSON.stringify(adminSession));

    const { data: roleRow, error: roleError } = await supa
      .from("academy_admin_users").select("rolle, schule_id").eq("user_id", data.user.id).maybeSingle();
    if(roleError || !roleRow){
      errEl.textContent = "Kein Admin-Zugang für dieses Konto hinterlegt";
      await supa.auth.signOut();
      return;
    }
    if(roleRow.rolle === "schule"){
      const { data: schuleRow } = await supa.from("academy_schulen").select("aktiv").eq("id", roleRow.schule_id).maybeSingle();
      if(schuleRow && !schuleRow.aktiv){
        errEl.textContent = "Dieser Schul-Zugang ist derzeit pausiert.";
        await supa.auth.signOut();
        return;
      }
    }
    myRole = roleRow.rolle;
    mySchule = roleRow.schule_id;
    showAdminApp();
  } catch(e){
    errEl.textContent = "Verbindungsfehler — bitte Internet prüfen";
  }
}

// ---- ADMIN-DASHBOARD (25.08.2026) ----
// Beantwortet in wenigen Sekunden: "Muss ich heute etwas tun?" -- statt sofort in
// Formularen und Listen zu landen.
function renderAdminDashboard(){
  const jetzt = new Date();
  const sichtbareSchueler = myRole === "super_admin"
    ? allSchueler : allSchueler.filter(function(s){ return s.schule_id === mySchule; });

  const aktiv = sichtbareSchueler.filter(function(s){ return s.aktiv && new Date(s.ablauf_am) > jetzt; });
  const ohneZustimmung = sichtbareSchueler.filter(function(s){ return !s.agb_akzeptiert_am; });
  const laeuftAb = aktiv.filter(function(s){
    const tage = (new Date(s.ablauf_am) - jetzt) / 86400000;
    return tage > 0 && tage <= 14;
  });
  const videosOhneId = allVideos.filter(function(v){ return !v.bunny_video_id; });
  const ungesendeteVideos = allVideos.filter(function(v){ return v.push_gesendet === false; });

  // Letzte Aktivität je Schüler ermitteln
  const letzteAktivitaet = {};
  adminFortschritt.forEach(function(f){
    if(!letzteAktivitaet[f.schueler_id] || f.gesehen_am > letzteAktivitaet[f.schueler_id]){
      letzteAktivitaet[f.schueler_id] = f.gesehen_am;
    }
  });
  const inaktiv = aktiv.filter(function(s){
    const letzte = letzteAktivitaet[s.id];
    if(!letzte) return true;
    return (jetzt - new Date(letzte)) / 86400000 > 14;
  });

  const kpis =
    '<div class="kpi-grid">' +
      '<div class="kpi"><div class="kpi-zahl">' + aktiv.length + '</div><div class="kpi-label">Aktive Schüler</div></div>' +
      '<div class="kpi"><div class="kpi-zahl">' + allVideos.length + '</div><div class="kpi-label">Videos</div></div>' +
      '<div class="kpi' + (laeuftAb.length ? " warn" : "") + '"><div class="kpi-zahl">' + laeuftAb.length + '</div><div class="kpi-label">Läuft in 14 Tagen ab</div></div>' +
      '<div class="kpi' + (inaktiv.length ? " warn" : "") + '"><div class="kpi-zahl">' + inaktiv.length + '</div><div class="kpi-label">Inaktiv &gt; 14 Tage</div></div>' +
    "</div>";

  const todos = [];
  if(videosOhneId.length) todos.push(["rot", videosOhneId.length + " Video(s) ohne Bunny-ID — für Schüler nicht abspielbar"]);
  if(ungesendeteVideos.length) todos.push(["gelb",
    ungesendeteVideos.length + " neue(s) Video(s) noch nicht angekündigt " +
    '<button id="sammel-push-btn" class="btn-primary" style="margin-left:8px;padding:5px 12px;font-size:12px;width:auto;display:inline-block;">' + icon("glocke","ic-s") + " Jetzt ankündigen</button>"]);
  if(ohneZustimmung.length) todos.push(["gelb", ohneZustimmung.length + " Schüler haben die Nutzungsbedingungen noch nicht bestätigt"]);
  laeuftAb.forEach(function(s){
    const tage = Math.ceil((new Date(s.ablauf_am) - jetzt) / 86400000);
    todos.push(["gelb", esc(s.name) + ": Zugang läuft in " + tage + " Tag(en) ab"]);
  });
  inaktiv.slice(0,5).forEach(function(s){
    const letzte = letzteAktivitaet[s.id];
    todos.push(["gelb", esc(s.name) + ": " + (letzte ? "zuletzt aktiv " + fmtDate(letzte) : "noch nie ein Video geschaut")]);
  });
  if(todos.length === 0) todos.push(["gruen", "Alles im grünen Bereich — nichts zu tun."]);

  const todoHtml = '<div class="admin-card glass"><div class="admin-form-title" style="margin-bottom:6px;">Handlungsbedarf</div>' +
    todos.map(function(t){
      return '<div class="todo-zeile ' + t[0] + '"><span class="td-dot"></span><span>' + t[1] + "</span></div>";
    }).join("") + "</div>";

  // Meistgesehene Videos -- zeigt dir, welche Inhalte wirklich genutzt werden
  const proVideo = {};
  adminFortschritt.forEach(function(f){ proVideo[f.video_id] = (proVideo[f.video_id]||0)+1; });
  const topVideos = Object.keys(proVideo).map(function(vid){
    const v = allVideos.find(function(x){ return x.id === vid; });
    return { titel: v ? v.titel : "(gelöscht)", anzahl: proVideo[vid] };
  }).sort(function(a,b){ return b.anzahl - a.anzahl; }).slice(0,5);

  const topHtml = '<div class="admin-card glass"><div class="admin-form-title" style="margin-bottom:6px;">Meistgesehene Videos</div>' +
    (topVideos.length ? topVideos.map(function(t){
      return '<div class="hist-zeile"><span class="hist-titel">' + esc(t.titel) + '</span><span class="hist-anzahl">' + t.anzahl + "×</span></div>";
    }).join("") : '<div class="admin-sub">Noch keine Aufrufe.</div>') + "</div>";

  document.getElementById("admin-content").innerHTML = kpis + todoHtml + topHtml;
  const sammelBtn = document.getElementById("sammel-push-btn");
  if(sammelBtn){
    sammelBtn.addEventListener("click", async function(){
      sammelBtn.disabled = true; sammelBtn.textContent = "Sende …";
      try{
        const { data: sessionData } = await supa.auth.getSession();
        const token = sessionData && sessionData.session ? sessionData.session.access_token : SUPABASE_ANON_KEY;
        const res = await fetch(SUPABASE_URL + "/functions/v1/academy-notify-batch", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if(res.ok && data.ok){
          showToast(data.push_gesendet_an > 0
            ? data.videos + " Video(s) angekündigt, " + data.push_gesendet_an + " Push(es) verschickt"
            : "Angekündigt (kein Schüler hat Push aktiviert)");
          await loadAdminData();
          renderAdminDashboard();
        } else {
          showToast("Fehler: " + (data.error || "unbekannt"));
          sammelBtn.disabled = false; sammelBtn.innerHTML = icon("glocke","ic-s") + " Jetzt ankündigen";
        }
      } catch(e){
        showToast("Verbindungsfehler beim Senden");
        sammelBtn.disabled = false; sammelBtn.innerHTML = icon("glocke","ic-s") + " Jetzt ankündigen";
      }
    });
  }
}

// Zeigt pro Schüler: welches Video wie oft, wann zuletzt, und was noch offen ist.
// Häufige Wiederholungen sind bewusst hervorgehoben -- das ist ein Signal dafür,
// dass ein Thema noch nicht sitzt, nicht nur eine Zahl.
function renderAdminHistorie(){
  const s = allSchueler.find(function(x){ return x.id === historieSchuelerId; });
  if(!s){
    adminTab = "schueler"; renderAdmin(); return;
  }
  const eigene = adminFortschritt.filter(function(f){ return f.schueler_id === s.id; });

  const proVideo = {};
  eigene.forEach(function(f){
    if(!proVideo[f.video_id]) proVideo[f.video_id] = { anzahl:0, zuletzt:f.gesehen_am };
    proVideo[f.video_id].anzahl++;
    if(f.gesehen_am > proVideo[f.video_id].zuletzt) proVideo[f.video_id].zuletzt = f.gesehen_am;
  });

  const gesehen = Object.keys(proVideo).map(function(vid){
    const v = allVideos.find(function(x){ return x.id === vid; });
    return { titel: v ? v.titel : "(gelöschtes Video)", anzahl: proVideo[vid].anzahl, zuletzt: proVideo[vid].zuletzt };
  }).sort(function(a,b){ return b.anzahl - a.anzahl; });

  const offen = allVideos.filter(function(v){ return !proVideo[v.id]; });

  const kopf =
    '<button class="krumen zurueck-zeile" id="hist-zurueck">' + icon("zurueck") + "<span>Schülerliste</span></button>" +
    '<div class="admin-form-title" style="font-size:17px;">' + esc(s.name) + "</div>" +
    '<div class="admin-sub" style="margin-bottom:14px;">' + eigene.length + " Aufrufe · " + gesehen.length + " von " + allVideos.length + " Videos gesehen" +
      (eigene.length ? " · zuletzt " + fmtDateTime(eigene[0].gesehen_am) : "") + "</div>";

  const gesehenHtml = '<div class="admin-card glass"><div class="admin-form-title" style="margin-bottom:6px;">Angeschaut</div>' +
    (gesehen.length ? gesehen.map(function(g){
      return '<div class="hist-zeile">' +
        '<span class="hist-titel">' + esc(g.titel) + "</span>" +
        '<span class="hist-anzahl' + (g.anzahl >= 3 ? " oft" : "") + '">' + g.anzahl + "×</span>" +
        '<span class="hist-datum">' + fmtDate(g.zuletzt) + "</span>" +
      "</div>";
    }).join("") : '<div class="admin-sub">Noch kein Video angeschaut.</div>') + "</div>";

  const offenHtml = '<div class="admin-card glass"><div class="admin-form-title" style="margin-bottom:6px;">Noch offen (' + offen.length + ")</div>" +
    (offen.length ? offen.slice(0,15).map(function(v){
      return '<div class="hist-zeile"><span class="hist-titel">' + esc(v.titel) + "</span></div>";
    }).join("") + (offen.length > 15 ? '<div class="admin-sub" style="padding-top:8px;">… und ' + (offen.length-15) + " weitere</div>" : "")
    : '<div class="admin-sub">Alles gesehen 🎉</div>') + "</div>";

  document.getElementById("admin-content").innerHTML = kopf + gesehenHtml + offenHtml;
  document.getElementById("hist-zurueck").addEventListener("click", function(){
    historieSchuelerId = null; adminTab = "schueler"; renderAdmin();
  });
}
