<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahr-Akademie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --gruen:#3a7350; --gruen-hell:#4a8b45; --bg:#0c1410; --bg-2:#0f1a13;
    --surface:rgba(255,255,255,0.045); --surface-strong:rgba(255,255,255,0.075);
    --border:rgba(255,255,255,0.09); --text:#f1f5f0; --muted:#93a897; --faint:#5f7364;
    --gold:#c9a227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:'Barlow',-apple-system,sans-serif;
    background:radial-gradient(ellipse at top,var(--bg-2) 0%,var(--bg) 60%);
    color:var(--text);min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;}

  h1{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.02em;font-size:30px;margin:0;text-transform:uppercase;}
  .tagline{font-family:'Kaushan Script',cursive;color:var(--gruen-hell);font-size:16px;margin:2px 0 0;}

  .glass{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }

  .logo-img{width:64px;height:64px;border-radius:16px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.4);}

  /* ---------- LOGIN ---------- */
  .login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .login-screen .logo-img{width:88px;height:88px;margin:0 auto 18px;}
  .login-card{width:100%;max-width:340px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;margin-top:22px;}
  .login-card input{
    background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);
    padding:15px 16px;border-radius:14px;font-size:17px;text-align:center;font-family:'Barlow',sans-serif;
    letter-spacing:.02em;
  }
  .login-card input::placeholder{color:var(--faint);}
  .btn-primary{
    background:linear-gradient(180deg,var(--gruen-hell),var(--gruen));color:#fff;border:none;
    padding:15px;border-radius:14px;font-size:16.5px;font-weight:700;cursor:pointer;
    font-family:'Barlow',sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px rgba(58,115,80,.35);
  }
  .btn-primary:active{transform:translateY(1px);}
  .err{color:#e29586;font-size:13.5px;min-height:16px;}
  .demo-badge{
    display:inline-block;margin-top:16px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
    background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.35);letter-spacing:.03em;
  }

  /* ---------- HEADER / CATALOG ---------- */
  .header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .header .logo-img{width:44px;height:44px;flex-shrink:0;}
  .header-txt{flex:1;}
  .header-txt h1{font-size:21px;}
  .progress-line{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .logout{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:12px;
    padding:9px 13px;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;}
  .back{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;
    padding:10px 16px;font-size:14px;cursor:pointer;margin-bottom:14px;font-family:'Barlow',sans-serif;font-weight:600;}

  .section-label{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 2px 8px;}
  .stufe-row,.tag-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--surface);border:1px solid var(--border);color:var(--muted);
    padding:9px 15px;border-radius:24px;font-size:13.5px;cursor:pointer;white-space:nowrap;
    font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s;
  }
  .chip.active{background:var(--gruen);border-color:var(--gruen-hell);color:#fff;box-shadow:0 4px 14px rgba(58,115,80,.3);}
  .tag-chip .ort{opacity:.75;font-weight:400;font-size:11.5px;}

  .video-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .video-card{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;}
  .video-card:active{background:var(--surface-strong);}
  .video-play-ic{
    width:38px;height:38px;border-radius:50%;background:var(--gruen);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
  }
  .video-title{font-weight:700;font-size:15px;font-family:'Barlow',sans-serif;}
  .video-desc{color:var(--muted);font-size:13px;margin-top:2px;}
  .video-check{margin-left:auto;color:var(--gruen-hell);font-size:18px;flex-shrink:0;}
  .empty{color:var(--faint);text-align:center;padding:50px 20px;font-size:14.5px;}

  /* ---------- LERNPFAD (Stufen-Akkordeon) ---------- */
  .stufe-section{margin-bottom:12px;}
  .stufe-header{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;
  }
  .stufe-header.open{border-color:var(--gruen-hell);}
  .stufe-header-left{display:flex;align-items:center;gap:10px;}
  .stufe-caret{color:var(--faint);font-size:13px;width:12px;display:inline-block;}
  .stufe-name{font-weight:700;font-size:15px;font-family:'Barlow',sans-serif;}
  .video-code{
    min-width:38px;height:38px;border-radius:12px;background:var(--gruen);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;
  }
  .stufe-section .video-list{margin-top:8px;}

  .loading{text-align:center;padding:80px 0;color:var(--muted);font-size:14.5px;}

  /* ---------- PLAYER ---------- */
  .player-wrap{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .demo-player{
    aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--muted);text-align:center;padding:24px;
  }
  .demo-player .big-ic{font-size:38px;}

  /* ---------- ADMIN ---------- */
  .admin-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .admin-tab{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:var(--surface);
    border:1px solid var(--border);color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:'Barlow',sans-serif;}
  .admin-tab.active{background:var(--gruen);color:#fff;border-color:var(--gruen-hell);}
  .admin-card{padding:14px 16px;margin-bottom:10px;}
  .admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .admin-name{font-weight:700;font-size:14.5px;}
  .admin-sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .admin-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:14px;white-space:nowrap;}
  .badge-aktiv{background:rgba(74,139,69,.18);color:var(--gruen-hell);border:1px solid rgba(74,139,69,.35);}
  .badge-abgelaufen{background:rgba(226,149,134,.15);color:#e29586;border:1px solid rgba(226,149,134,.35);}
  .badge-gesperrt{background:rgba(255,255,255,.08);color:var(--faint);border:1px solid var(--border);}
  .admin-form{display:flex;flex-direction:column;gap:10px;padding:16px;margin-bottom:18px;}
  .admin-form input,.admin-form select{
    background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:14.5px;font-family:'Barlow',sans-serif;width:100%;
  }
  .admin-form label{font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px;}
  .admin-form-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  .icon-btn{background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px 8px;}
  .icon-btn.danger{color:#e29586;}
  .pin-display{font-family:monospace;font-size:15px;letter-spacing:.1em;color:var(--gold);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gruen);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:50;font-family:'Barlow',sans-serif;}
</style>
</head>

const STUFEN_ORDER = ["Grundstufe","Aufbaustufe","Leistungsstufe","Sonderfahrten","Grundfahraufgaben","Technik"];
const STUFE_PREFIX = {
  "Grundstufe":"G", "Aufbaustufe":"A", "Leistungsstufe":"L",
  "Sonderfahrten":"S", "Grundfahraufgaben":"GF", "Technik":"T"
};

function parseDeepLinkStufe(){
  const params = new URLSearchParams(location.search);
  const raw = (params.get("stufe") || "").trim().toLowerCase();
  if(!raw) return null;
  return STUFEN_ORDER.find(function(s){ return s.toLowerCase() === raw; }) || null;
}

// Baut den Lernpfad: pro Stufe alle Videos in Ausbildungsplan-Reihenfolge,
// mit eindeutigem Code (z. B. "G-1", "A-3") — das ersetzt das Suchen durch Blättern.
function buildLernpfad(){
  const tagsSorted = allTags.slice().sort(function(a,b){ return (a.reihenfolge||0) - (b.reihenfolge||0); });
  const result = [];
  STUFEN_ORDER.forEach(function(stufe){
    const tagsInStufe = tagsSorted.filter(function(t){ return t.stufe === stufe; });
    if(tagsInStufe.length === 0) return;
    let counter = 0;
    const videos = [];
    tagsInStufe.forEach(function(tag){
      const vids = videoTags.filter(function(vt){ return vt.tag_id === tag.id; })
        .map(function(vt){ return allVideos.find(function(v){ return v.id === vt.video_id; }); })
        .filter(Boolean);
      vids.forEach(function(v){
        counter++;
        videos.push({ video:v, tag:tag, code: STUFE_PREFIX[stufe] + "-" + counter });
      });
    });
    if(videos.length > 0) result.push({ stufe:stufe, videos:videos });
  });
  return result;
}

function addMonthsISO(date, n){
  const d = new Date(date);
  d.setMonth(d.getMonth()+n);
  return d.toISOString();
}
function genPin(){
  return String(Math.floor(1000 + Math.random()*9000));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function schuelerStatus(s){
  if(!s.aktiv) return "gesperrt";
  if(new Date(s.ablauf_am) < new Date()) return "abgelaufen";
  return "aktiv";
}

async function doLogin(){
  const tel = document.getElementById("lo-tel").value.trim();
  const pin = document.getElementById("lo-pin").value.trim();
  const errEl = document.getElementById("lo-err");
  errEl.textContent = "";
  if(!tel || !pin){ errEl.textContent = "Bitte Telefonnummer und PIN eingeben"; return; }

  if(DEMO_MODE){
    session = { demo:true, name:"Testfahrer" };
    localStorage.setItem("academy_session", JSON.stringify(session));
    showApp();
    return;
  }

  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ telefon: tel, pin: pin })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || "Login fehlgeschlagen"; return; }
    session = data;
    localStorage.setItem("academy_session", JSON.stringify(session));
    showApp();
  } catch(e){
    errEl.textContent = "Verbindungsfehler — bitte Internet prüfen";
  }
}

function doLogout(){

  session = null;
  openStufen = new Set();
  showLogin();
}

}

async function loadCatalog(){
  if(DEMO_MODE){
    allTags = DEMO_TAGS;
    allVideos = DEMO_VIDEOS;
    videoTags = DEMO_VIDEO_TAGS;
    allPruefer = DEMO_PRUEFER;
    videoPruefer = [];
    return;
  }
  const tagsRes = await supa.from("academy_tags").select("*").order("reihenfolge");
  const videosRes = await supa.from("academy_videos").select("*").order("reihenfolge");
  const vtagsRes = await supa.from("academy_video_tags").select("*");
  const prRes = await supa.from("academy_pruefer").select("*");
  const vprRes = await supa.from("academy_video_pruefer").select("*");
  allTags = tagsRes.data || [];
  // Schüler sehen nur Videos, die tatsächlich mit Bunny verknüpft sind — sonst
  // klickt jemand auf ein "leeres" Video, das noch gar nicht abspielbar ist.
  allVideos = (videosRes.data || []).filter(function(v){ return !!v.bunny_video_id; });
  videoTags = vtagsRes.data || [];
  allPruefer = prRes.data || [];
  videoPruefer = vprRes.data || [];
}

function buildPruefungsstrecken(){
  // Gruppiert Videos nach Prüfer. Ein Video kann bei mehreren Prüfern auftauchen
  // (geteilte Strecken) — genau wie ein Video mehrere Themen-Tags haben kann.
  const result = [];
  allPruefer.forEach(function(pr){
    const vids = videoPruefer.filter(function(vp){ return vp.pruefer_id === pr.id; })
      .map(function(vp){ return allVideos.find(function(v){ return v.id === vp.video_id; }); })
      .filter(Boolean);
    if(vids.length > 0) result.push({ pruefer: pr, videos: vids });
  });
  return result;
}

function renderLernpfadHtml(){
  const pfad = buildLernpfad();
  const sections = pfad.map(function(gruppe){
    const isOpen = openStufen.has(gruppe.stufe);
    const seenInStufe = gruppe.videos.filter(function(x){ return seenVideoIds.has(x.video.id); }).length;
    const fertig = seenInStufe === gruppe.videos.length;

    const videoRows = gruppe.videos.map(function(x){
      const desc = x.video.beschreibung ? '<div class="video-desc">' + esc(x.video.beschreibung) + "</div>" : "";
      const check = seenVideoIds.has(x.video.id) ? '<span class="video-check">✓</span>' : "";
      return '<div class="video-card glass" data-vid="' + esc(x.video.id) + '">' +
        '<div class="video-code">' + esc(x.code) + "</div>" +
        '<div><div class="video-title">' + esc(x.video.titel) + "</div>" +
          '<div class="video-desc" style="opacity:.7;">' + esc(x.tag.label) + (x.tag.ort ? " · " + esc(x.tag.ort) : "") + "</div>" +
          desc +
        "</div>" + check +
      "</div>";
    }).join("");

    return '<div class="stufe-section">' +
      '<div class="stufe-header' + (isOpen ? " open" : "") + '" data-stufe="' + esc(gruppe.stufe) + '">' +
        '<div class="stufe-header-left">' +
          '<span class="stufe-caret">' + (isOpen ? "▾" : "▸") + "</span>" +
          '<span class="stufe-name">' + esc(gruppe.stufe) + "</span>" +
        "</div>" +
        '<span class="admin-badge ' + (fertig ? "badge-aktiv" : "badge-gesperrt") + '">' + seenInStufe + "/" + gruppe.videos.length + "</span>" +
      "</div>" +
      (isOpen ? '<div class="video-list">' + videoRows + "</div>" : "") +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Videos verfügbar.</div>';
  return sections;
}

function renderPruefungsstreckenHtml(){
  const gruppen = buildPruefungsstrecken();
  return gruppen.map(function(g){
    const isOpen = openPruefer.has(g.pruefer.id);
    const videoRows = g.videos.map(function(v){
      const tagsForVideo = videoTags.filter(function(vt){ return vt.video_id === v.id; })
        .map(function(vt){ const t = allTags.find(function(x){ return x.id === vt.tag_id; }); return t ? t.label : null; })
        .filter(Boolean).join(", ");
      const check = seenVideoIds.has(v.id) ? '<span class="video-check">✓</span>' : "";
      return '<div class="video-card glass" data-vid="' + esc(v.id) + '">' +
        '<div><div class="video-title">' + esc(v.titel) + "</div>" +
          (tagsForVideo ? '<div class="video-desc" style="opacity:.7;">Enthält: ' + esc(tagsForVideo) + "</div>" : "") +
        "</div>" + check +
      "</div>";
    }).join("");

    return '<div class="stufe-section">' +
      '<div class="stufe-header' + (isOpen ? " open" : "") + '" data-pruefer="' + esc(g.pruefer.id) + '">' +
        '<div class="stufe-header-left">' +
          '<span class="stufe-caret">' + (isOpen ? "▾" : "▸") + "</span>" +
          '<span class="stufe-name">' + esc(g.pruefer.name) + "</span>" +
        "</div>" +
        '<span class="admin-badge badge-gesperrt">' + g.videos.length + " Video" + (g.videos.length === 1 ? "" : "s") + "</span>" +
      "</div>" +
      (isOpen ? '<div class="video-list">' + videoRows + "</div>" : "") +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Prüfungsstrecken hinterlegt.</div>';
}

function renderCatalog(){
  const totalVideos = allVideos.length;
  const seenCount = allVideos.filter(function(v){ return seenVideoIds.has(v.id); }).length;
  const content = mainView === "lernpfad" ? renderLernpfadHtml() : renderPruefungsstreckenHtml();

  document.getElementById("app").innerHTML =
    '<div class="header">' +
      '<img class="logo-img" src="' + LOGO + '" alt="Logo">' +
      '<div class="header-txt"><h1>Fahr-Akademie</h1><div class="progress-line">' + seenCount + " von " + totalVideos + " Videos gesehen</div></div>" +
      '<button id="logout-btn" class="logout">Abmelden</button>' +
    "</div>" +
    (DEMO_MODE ? '<div class="demo-badge">Demo-Modus — Beispieldaten</div>' : "") +
    '<div class="admin-tabs">' +
      '<div class="admin-tab' + (mainView==="lernpfad"?" active":"") + '" data-view="lernpfad">Dein Lernpfad</div>' +
      '<div class="admin-tab' + (mainView==="pruefungsstrecken"?" active":"") + '" data-view="pruefungsstrecken">Prüfungsstrecken</div>' +
    "</div>" +
    content;

  document.querySelectorAll("[data-view]").forEach(function(t){
    t.addEventListener("click", function(){ mainView = t.dataset.view; renderCatalog(); });
  });
  document.querySelectorAll(".stufe-header[data-stufe]").forEach(function(h){
    h.addEventListener("click", function(){
      const s = h.dataset.stufe;
      if(openStufen.has(s)){ openStufen.delete(s); } else { openStufen.add(s); }
      renderCatalog();
    });
  });
  document.querySelectorAll(".stufe-header[data-pruefer]").forEach(function(h){
    h.addEventListener("click", function(){
      const p = h.dataset.pruefer;
      if(openPruefer.has(p)){ openPruefer.delete(p); } else { openPruefer.add(p); }
      renderCatalog();
    });
  });
  document.querySelectorAll(".video-card").forEach(function(c){
    c.addEventListener("click", function(){ openVideo(c.dataset.vid); });
  });
  document.getElementById("logout-btn").addEventListener("click", doLogout);
}

function markSeen(videoId){
  seenVideoIds.add(videoId);
  localStorage.setItem("academy_demo_seen", JSON.stringify(Array.from(seenVideoIds)));
}

async function openVideo(videoId){
  if(DEMO_MODE){
    markSeen(videoId);
    const v = allVideos.find(function(x){ return x.id === videoId; });
    document.getElementById("app").innerHTML =
      '<button id="back-btn" class="back">← Zurück</button>' +
      '<div class="player-wrap"><div class="demo-player">' +
        '<div class="big-ic">▶</div>' +
        '<div style="font-weight:700;color:var(--text);font-size:16px;">' + esc(v ? v.titel : "") + "</div>" +
        '<div>Demo-Modus — hier würde das echte Video laufen, sobald Bunny Stream verbunden ist.</div>' +
      "</div></div>";
    document.getElementById("back-btn").addEventListener("click", renderCatalog);
    return;
  }

  document.getElementById("app").innerHTML = '<div class="loading">Video wird geladen …</div>';
  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-video-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ session_token: session.session_token, video_id: videoId })
    });
    const data = await res.json();

    if(!res.ok){
      if(res.status === 401 || res.status === 403){
        localStorage.removeItem("academy_session");
        session = null;
        showLogin();
        return;
      }
      document.getElementById("app").innerHTML =
        '<div class="err">' + esc(data.error || "Fehler beim Laden") + '</div><button id="back-btn" class="back">Zurück</button>';
      document.getElementById("back-btn").addEventListener("click", renderCatalog);
      return;
    }

    const embedUrl = "https://iframe.mediadelivery.net/embed/" + data.library_id + "/" + data.bunny_video_id +
      "?token=" + data.token + "&expires=" + data.expires;

    document.getElementById("app").innerHTML =
      '<button id="back-btn" class="back">← Zurück</button>' +
      '<div class="player-wrap"><iframe src="' + embedUrl + '" loading="lazy" ' +
      'style="border:0;width:100%;aspect-ratio:16/9;display:block;" allow="autoplay; fullscreen"></iframe></div>';
    document.getElementById("back-btn").addEventListener("click", renderCatalog);
  } catch(e){
    document.getElementById("app").innerHTML = '<div class="err">Verbindungsfehler</div>';
  }
}

async function doAdminLogin(){
  const email = document.getElementById("ao-email").value.trim();
  const pass = document.getElementById("ao-pass").value.trim();
  const errEl = document.getElementById("ao-err");
  errEl.textContent = "";
  if(!email || !pass){ errEl.textContent = "Bitte E-Mail und Passwort eingeben"; return; }

  if(DEMO_MODE){
    adminSession = { demo:true, email:email };
    myRole = "super_admin";
    mySchule = null;
    localStorage.setItem("academy_admin_session", JSON.stringify(adminSession));
    showAdminApp();
    return;
  }
  try{
    const { data, error } = await supa.auth.signInWithPassword({ email:email, password:pass });
    if(error){ errEl.textContent = "Login fehlgeschlagen: " + error.message; return; }
    adminSession = { email:email };
    localStorage.setItem("academy_admin_session", JSON.stringify(adminSession));

    const { data: roleRow, error: roleError } = await supa
      .from("academy_admin_users").select("rolle, schule_id").eq("user_id", data.user.id).maybeSingle();
    if(roleError || !roleRow){
      errEl.textContent = "Kein Admin-Zugang für dieses Konto hinterlegt";
      await supa.auth.signOut();
      return;
    }
    if(roleRow.rolle === "schule"){
      const { data: schuleRow } = await supa.from("academy_schulen").select("aktiv").eq("id", roleRow.schule_id).maybeSingle();
      if(schuleRow && !schuleRow.aktiv){
        errEl.textContent = "Dieser Schul-Zugang ist derzeit pausiert.";
        await supa.auth.signOut();
        return;
      }
    }
    myRole = roleRow.rolle;
    mySchule = roleRow.schule_id;
    showAdminApp();
  } catch(e){
    errEl.textContent = "Verbindungsfehler — bitte Internet prüfen";
  }
}

  localStorage.removeItem("academy_admin_session");
  adminSession = null;
  location.hash = "";
  init();
}

    showAdminApp();
    return;
  }
  if(myRole){ showAdminApp(); return; }
  document.getElementById("app").innerHTML = '<div class="loading">Lädt …</div>';
  const { data: userData } = await supa.auth.getUser();
  if(!userData || !userData.user){ doAdminLogout(); return; }
  const { data: roleRow } = await supa
    .from("academy_admin_users").select("rolle, schule_id").eq("user_id", userData.user.id).maybeSingle();
  if(!roleRow){ doAdminLogout(); return; }
  myRole = roleRow.rolle;
  mySchule = roleRow.schule_id;
  showAdminApp();
}

    ? [["schueler","Schüler"],["fahrlehrer","Fahrlehrer"],["videos","Videos"],["pruefer","Prüfer"],["schulen","Schulen"]]
    : [["schueler","Schüler"],["fahrlehrer","Fahrlehrer"]];

  const tabsHtml = '<div class="admin-tabs">' +
    tabs.map(function(t){

  "</div>";

    "</div>" +
    (DEMO_MODE ? '<div class="demo-badge">Demo-Modus — Beispieldaten</div>' : "") +
    tabsHtml +
    '<div id="admin-content"></div>';

  document.getElementById("admin-logout-btn").addEventListener("click", doAdminLogout);
  document.querySelectorAll(".admin-tab").forEach(function(t){
    t.addEventListener("click", function(){ adminTab = t.dataset.tab; renderAdmin(); });

  if(!tabs.find(function(t){ return t[0] === adminTab; })) adminTab = "schueler";

  if(adminTab === "schueler") renderAdminSchueler();

async function createSchueler(){
  const name = document.getElementById("ns-name").value.trim();
  const tel = document.getElementById("ns-tel").value.trim();
  const email = document.getElementById("ns-email").value.trim();
  const klasse = document.getElementById("ns-klasse").value;
  const flId = document.getElementById("ns-fl").value;
  if(!name || !tel){ showToast("Name und Telefonnummer sind Pflicht"); return; }

  const pin = genPin();
  const jetzt = new Date();
  const neu = {
    id: "s" + Date.now(),
    name: name, telefon: tel, email: email || null, pin: pin, klasse: klasse,
    fahrlehrer_id: flId,
    vergeben_von: flId,
    empfohlen_von: flId === "serband" ? null : flId,
    erstellt_am: jetzt.toISOString(),
    ablauf_am: addMonthsISO(jetzt, 6),
    aktiv: true
  };

  if(DEMO_MODE){
    DEMO_SCHUELER.unshift(neu);
    allSchueler = DEMO_SCHUELER;
    await sendPinMail(neu);
    renderAdminSchueler();
    showToast("Schüler angelegt — PIN " + (email ? "per Mail verschickt" : "wurde NICHT verschickt (keine E-Mail hinterlegt)"));
    return;
  }

  const { error } = await supa.from("academy_schueler").insert(neu);
  if(error){ showToast("Fehler: " + error.message); return; }
  await sendPinMail(neu);
  await loadAdminData();
  renderAdminSchueler();
  showToast("Schüler angelegt — PIN per Mail verschickt");
}

async function sendPinMail(schueler){
  if(!schueler.email) return;
  if(DEMO_MODE){
    console.log("[DEMO] PIN-Mail an " + schueler.email + ": PIN " + schueler.pin);
    return;
  }
  try{
    await fetch(SUPABASE_URL + "/functions/v1/academy-send-pin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ name: schueler.name, email: schueler.email, telefon: schueler.telefon, pin: schueler.pin })
    });
  } catch(e){
    showToast("Schüler gespeichert, aber Mail-Versand fehlgeschlagen");
  }
}

async function resendPin(id){
  const s = allSchueler.find(function(x){ return x.id === id; });
  if(!s){ return; }
  if(!s.email){ showToast("Keine E-Mail hinterlegt"); return; }
  await sendPinMail(s);
  showToast("PIN erneut an " + s.email + " gesendet");
}

async function toggleSchueler(id){
  const s = allSchueler.find(function(x){ return x.id === id; });
  if(!s) return;
  s.aktiv = !s.aktiv;

  if(DEMO_MODE){
    renderAdminSchueler();
    return;
  }
  const { error } = await supa.from("academy_schueler").update({ aktiv: s.aktiv }).eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  renderAdminSchueler();
}

async function deleteSchueler(id){
  if(!confirm("Diesen Schüler wirklich löschen?")) return;

  if(DEMO_MODE){
    DEMO_SCHUELER = DEMO_SCHUELER.filter(function(x){ return x.id !== id; });
    allSchueler = DEMO_SCHUELER;
    renderAdminSchueler();
    return;
  }
  const { error } = await supa.from("academy_schueler").delete().eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminSchueler();
}

async function createVideo(){
  const titel = document.getElementById("nv-titel").value.trim();
  const desc = document.getElementById("nv-desc").value.trim();
  const tagId = document.getElementById("nv-tag").value;
  const bunnyId = document.getElementById("nv-bunny").value.trim();
  const gewaehltePruefer = Array.from(document.querySelectorAll(".nv-pruefer-cb:checked")).map(function(cb){ return cb.value; });
  if(!titel){ showToast("Titel ist Pflicht"); return; }

  const neu = { id:"v" + Date.now(), titel:titel, beschreibung: desc || null, bunny_video_id: bunnyId || null };
  const neuVt = { video_id: neu.id, tag_id: tagId };

  if(DEMO_MODE){
    DEMO_VIDEOS.unshift(neu);
    DEMO_VIDEO_TAGS.push(neuVt);
    gewaehltePruefer.forEach(function(pid){ videoPruefer.push({ video_id:neu.id, pruefer_id:pid }); });
    allVideos = DEMO_VIDEOS; videoTags = DEMO_VIDEO_TAGS;
    renderAdminVideos();
    showToast("Video angelegt");
    return;
  }
  const { error } = await supa.from("academy_videos").insert(neu);
  if(error){ showToast("Fehler: " + error.message); return; }
  await supa.from("academy_video_tags").insert(neuVt);
  if(gewaehltePruefer.length){
    await supa.from("academy_video_pruefer").insert(gewaehltePruefer.map(function(pid){ return { video_id:neu.id, pruefer_id:pid }; }));
  }
  await loadAdminData();
  renderAdminVideos();
  showToast("Video angelegt");
}

async function deleteVideo(id){

  const { error } = await supa.from("academy_videos").delete().eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminVideos();
}

    ? allFahrlehrer
    : allFahrlehrer.filter(function(f){ return f.schule_id === mySchule; });

  const rows = visible.map(function(f){
    const schule = allSchulen.find(function(s){ return s.id === f.schule_id; });
    return '<div class="admin-card glass">' +
      '<div class="admin-row">' +
        '<div>' +
          '<div class="admin-name">' + esc(f.name) + "</div>" +
          (f.schule_id ? '<div class="admin-sub">' + esc(schule ? schule.name : f.schule_id) + "</div>" : '<div class="admin-sub">Kein Schul-Bezug (Direktverkauf)</div>') +
        "</div>" +
        (f.id === "serband" ? "" : '<button class="icon-btn danger" data-delfl="' + esc(f.id) + '" title="Löschen">🗑️</button>') +
      "</div>" +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Fahrlehrer angelegt.</div>';

  document.getElementById("admin-content").innerHTML =
    '<div class="admin-form glass">' +
      '<div class="admin-form-title">Neuen Fahrlehrer anlegen</div>' +
      '<label>Name</label><input id="nfl-name" placeholder="Vor- und Nachname">' +
      '<button class="btn-primary" id="nfl-btn" style="margin-top:6px;">Fahrlehrer anlegen</button>' +
    "</div>" +
    '<div class="section-label">Fahrlehrer (' + visible.length + ")</div>" +
    rows;

  document.getElementById("nfl-btn").addEventListener("click", createFahrlehrer);
  document.querySelectorAll("[data-delfl]").forEach(function(b){
    b.addEventListener("click", function(){ deleteFahrlehrer(b.dataset.delfl); });
  });
}

async function createFahrlehrer(){
  const name = document.getElementById("nfl-name").value.trim();
  if(!name){ showToast("Name ist Pflicht"); return; }
  const neu = { id:"fl" + Date.now(), name:name, schule_id: myRole === "super_admin" ? null : mySchule };

  if(DEMO_MODE){
    DEMO_FAHRLEHRER.push(neu);
    allFahrlehrer = DEMO_FAHRLEHRER;
    renderAdminFahrlehrer();
    showToast("Fahrlehrer angelegt");
    return;
  }
  const { error } = await supa.from("academy_fahrlehrer").insert(neu);
  if(error){ showToast("Fehler: " + error.message); return; }
  await loadAdminData();
  renderAdminFahrlehrer();
  showToast("Fahrlehrer angelegt");
}

async function deleteFahrlehrer(id){
  if(!confirm("Diesen Fahrlehrer wirklich löschen?")) return;
  if(DEMO_MODE){
    DEMO_FAHRLEHRER = DEMO_FAHRLEHRER.filter(function(x){ return x.id !== id; });
    allFahrlehrer = DEMO_FAHRLEHRER;
    renderAdminFahrlehrer();
    return;
  }
  const { error } = await supa.from("academy_fahrlehrer").delete().eq("id", id);
  if(error){ showToast("Fehler (evtl. hat dieser Fahrlehrer noch Schüler zugeordnet): " + error.message); return; }
  await loadAdminData();
  renderAdminFahrlehrer();
}

/* ---------- SCHULEN-TAB (nur Super-Admin) ---------- */
function renderAdminSchulen(){
  const rows = allSchulen.map(function(s){
    const badgeClass = s.aktiv ? "badge-aktiv" : "badge-gesperrt";
    const badgeText = s.aktiv ? "Aktiv" : "Gesperrt";
    return '<div class="admin-card glass">' +
      '<div class="admin-row">' +
        '<div class="admin-name">' + esc(s.name) + "</div>" +
        '<div style="text-align:right;">' +
          '<div class="admin-badge ' + badgeClass + '">' + badgeText + "</div>" +
          '<div style="margin-top:8px;">' +
            '<button class="icon-btn" data-toggleschule="' + esc(s.id) + '" title="Sperren/Entsperren (Kill-Switch)">' + (s.aktiv ? "🔒" : "🔓") + "</button>" +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }).join("") || '<div class="empty">Noch keine Schulen angelegt.</div>';

  document.getElementById("admin-content").innerHTML =
    '<div class="admin-form glass">' +
      '<div class="admin-form-title">Neue Schule + Schul-Login anlegen</div>' +
      '<label>Name der Schule</label><input id="nsch-name" placeholder="z. B. Fahrschule Boost">' +
      '<label>Login-E-Mail für die Schule</label><input id="nsch-email" type="email" placeholder="schule@mail.de">' +
      '<button class="btn-primary" id="nsch-btn" style="margin-top:6px;">Schule &amp; Login anlegen</button>' +
      '<div class="admin-sub" style="margin-top:4px;">Die Schule kann sich danach selbst über den Admin-Bereich einloggen und NUR ihre eigenen Schüler und Fahrlehrer verwalten. Du als Super-Admin siehst und kontrollierst weiterhin alles, inkl. sofortigem Sperren (Kill-Switch).</div>' +
    "</div>" +
    '<div class="section-label">Alle Schulen (' + allSchulen.length + ")</div>" +
    rows;

  document.getElementById("nsch-btn").addEventListener("click", createSchule);
  document.querySelectorAll("[data-toggleschule]").forEach(function(b){
    b.addEventListener("click", function(){ toggleSchule(b.dataset.toggleschule); });
  });
}

async function createSchule(){
  const name = document.getElementById("nsch-name").value.trim();
  const email = document.getElementById("nsch-email").value.trim();
  if(!name || !email){ showToast("Name und E-Mail sind Pflicht"); return; }
  const schuleId = "schule_" + Date.now();

  if(DEMO_MODE){
    allSchulen.push({ id:schuleId, name:name, aktiv:true });
    showToast("(Demo) Schule angelegt — im echten Modus würde jetzt ein Login per Mail-Adresse erzeugt");
    renderAdminSchulen();
    return;
  }

  try{
    const { data: sessionData } = await supa.auth.getSession();
    const token = sessionData && sessionData.session ? sessionData.session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + "/functions/v1/academy-create-schuladmin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ schule_id: schuleId, schule_name: name, email: email })
    });
    const data = await res.json();
    if(!res.ok){ showToast("Fehler: " + (data.error || "unbekannt")); return; }

    await loadAdminData();
    renderAdminSchulen();
    showToast("Schule angelegt. Login-Daten unten notieren!");
    document.getElementById("admin-content").insertAdjacentHTML("afterbegin",
      '<div class="admin-card glass" style="border-color:var(--gold);">' +
        '<div class="admin-form-title">Neuer Schul-Login (nur jetzt sichtbar!)</div>' +
        '<div class="admin-sub">E-Mail: <strong>' + esc(data.email) + '</strong></div>' +
        '<div class="admin-sub">Passwort: <span class="pin-display">' + esc(data.password) + '</span></div>' +
      "</div>"
    );
  } catch(e){
    showToast("Verbindungsfehler beim Anlegen der Schule");
  }
}

async function toggleSchule(id){
  const s = allSchulen.find(function(x){ return x.id === id; });
  if(!s) return;
  s.aktiv = !s.aktiv;

  if(DEMO_MODE){
    renderAdminSchulen();
    return;
  }
  const { error } = await supa.from("academy_schulen").update({ aktiv: s.aktiv }).eq("id", id);
  if(error){ showToast("Fehler: " + error.message); return; }
  renderAdminSchulen();
}

init();
</script>
</body>
</html>
